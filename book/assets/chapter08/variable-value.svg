<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Имя переменной связано со значением</title>
  <desc id="desc">Слева показано имя переменной name, справа значение Анна, между ними стрелка связи.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 650; }
      .body { font-size: 22px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 54px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="84" text-anchor="middle">Переменная — это имя, связанное со значением</text>

  <rect class="accent" x="150" y="230" width="310" height="180" rx="20"/>
  <text class="mono ink" x="305" y="325" text-anchor="middle">name</text>
  <text class="text body muted" x="305" y="370" text-anchor="middle">имя</text>

  <path class="line" d="M490 320h220" marker-end="url(#arrow)"/>
  <text class="text label blue" x="600" y="275" text-anchor="middle">связано со</text>

  <rect class="soft" x="740" y="230" width="310" height="180" rx="20"/>
  <text class="mono ink" x="895" y="325" text-anchor="middle">"Анна"</text>
  <text class="text body muted" x="895" y="370" text-anchor="middle">значение</text>

  <rect class="card" x="250" y="505" width="700" height="90" rx="18"/>
  <text class="text label ink" x="600" y="560" text-anchor="middle">Главная мысль: имя указывает на значение</text>
</svg>
