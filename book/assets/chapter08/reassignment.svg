<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Повторное присваивание меняет связь имени со значением</title>
  <desc id="desc">Временная шкала показывает состояние score связано с 10, затем строку score равно 15, затем новое состояние score связано с 15.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line-olive { fill: none; stroke: #6f7d2d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 650; }
      .body { font-size: 21px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 34px; font-weight: 700; }
      .bigmono { font-family: "Cascadia Code", Consolas, monospace; font-size: 44px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6f7d2d"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="82" text-anchor="middle">Повторное присваивание меняет связь</text>

  <rect class="card" x="70" y="170" width="310" height="330" rx="20"/>
  <text class="text label blue" x="225" y="222" text-anchor="middle">Сначала</text>
  <rect class="accent" x="105" y="275" width="120" height="78" rx="14"/>
  <text class="mono ink" x="165" y="324" text-anchor="middle">score</text>
  <path class="line" d="M240 314h58" marker-end="url(#arrow-blue)"/>
  <rect class="soft" x="310" y="275" width="55" height="78" rx="14"/>
  <text class="bigmono ink" x="337" y="326" text-anchor="middle">10</text>
  <text class="text body muted" x="225" y="430" text-anchor="middle">score связано с 10</text>

  <path class="line" d="M395 335h115" marker-end="url(#arrow-blue)"/>

  <rect class="card" x="515" y="170" width="310" height="330" rx="20"/>
  <text class="text label blue" x="670" y="222" text-anchor="middle">Новая строка</text>
  <rect class="accent" x="555" y="275" width="230" height="78" rx="14"/>
  <text class="bigmono ink" x="670" y="326" text-anchor="middle">score = 15</text>
  <text class="text body muted" x="670" y="430" text-anchor="middle">новое присваивание</text>

  <path class="line-olive" d="M840 335h115" marker-end="url(#arrow-olive)"/>

  <rect class="card" x="960" y="170" width="170" height="330" rx="20"/>
  <text class="text label olive" x="1045" y="222" text-anchor="middle">Потом</text>
  <rect class="accent" x="985" y="275" width="120" height="78" rx="14"/>
  <text class="mono ink" x="1045" y="324" text-anchor="middle">score</text>
  <path class="line-olive" d="M1005 375 C955 410 955 465 1005 500" marker-end="url(#arrow-olive)"/>
  <rect class="soft" x="1018" y="465" width="55" height="78" rx="14"/>
  <text class="bigmono ink" x="1045" y="516" text-anchor="middle">15</text>

  <rect class="card" x="250" y="565" width="700" height="70" rx="16"/>
  <text class="text body ink" x="600" y="608" text-anchor="middle">Имя осталось тем же, но теперь оно связано с новым значением</text>
</svg>
