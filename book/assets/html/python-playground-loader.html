<script>
(function () {
  var cssLink = Array.prototype.find.call(
    document.querySelectorAll('link[rel="stylesheet"]'),
    function (link) {
      return link.href.indexOf('python-playground.css') !== -1;
    }
  );

  var script = document.createElement('script');
  script.defer = true;
  script.src = cssLink
    ? cssLink.href.replace('/css/python-playground.css', '/js/python-playground.js')
    : new URL('book/assets/js/python-playground.js', document.baseURI).href;
  document.body.appendChild(script);
})();
</script>
