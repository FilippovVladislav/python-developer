<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Транзистор как электронный выключатель</title>
  <desc id="desc">Два состояния транзистора: нет сигнала и есть сигнал.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .chip { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line-off { fill: none; stroke: #9aa6b2; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 26px; font-weight: 650; }
      .body { font-size: 22px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 46px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="90" y="82">Транзистор можно представить как маленький выключатель</text>

  <rect class="panel" x="85" y="140" width="475" height="430" rx="18"/>
  <rect class="panel" x="640" y="140" width="475" height="430" rx="18"/>

  <text class="text label muted" x="322" y="200" text-anchor="middle">Состояние 0</text>
  <text class="text label blue" x="877" y="200" text-anchor="middle">Состояние 1</text>

  <line class="line-off" x1="170" y1="355" x2="285" y2="355"/>
  <line class="line-off" x1="360" y1="355" x2="475" y2="355"/>
  <circle cx="285" cy="355" r="12" fill="#ffffff" stroke="#9aa6b2" stroke-width="4"/>
  <circle cx="360" cy="355" r="12" fill="#ffffff" stroke="#9aa6b2" stroke-width="4"/>
  <line class="line-off" x1="300" y1="338" x2="348" y2="300"/>
  <rect class="chip" x="245" y="420" width="155" height="70" rx="14"/>
  <text class="text body ink" x="322" y="464" text-anchor="middle">нет сигнала</text>
  <text class="text mono muted" x="322" y="285" text-anchor="middle">0</text>

  <line class="line" x1="725" y1="355" x2="830" y2="355"/>
  <line class="line" x1="925" y1="355" x2="1030" y2="355"/>
  <circle cx="830" cy="355" r="12" fill="#ffffff" stroke="#2f5f8f" stroke-width="4"/>
  <circle cx="925" cy="355" r="12" fill="#ffffff" stroke="#2f5f8f" stroke-width="4"/>
  <line class="line" x1="842" y1="350" x2="913" y2="350"/>
  <circle cx="760" cy="355" r="7" class="olive"/>
  <circle cx="800" cy="355" r="7" class="olive"/>
  <circle cx="965" cy="355" r="7" class="olive"/>
  <rect class="chip" x="800" y="420" width="155" height="70" rx="14"/>
  <text class="text body ink" x="877" y="464" text-anchor="middle">есть сигнал</text>
  <text class="text mono blue" x="877" y="285" text-anchor="middle">1</text>

  <text class="text body muted" x="600" y="635" text-anchor="middle">Два устойчивых состояния проще распознавать быстро и надежно</text>
</svg>
