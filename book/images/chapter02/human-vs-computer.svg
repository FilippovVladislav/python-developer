<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Человек и компьютер понимают инструкции по-разному</title>
  <desc id="desc">Минималистичная схема: человек использует контекст, компьютер выполняет только точные команды.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .soft-blue { fill: #eef4f8; }
      .soft-olive { fill: #f0f3df; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line-muted { fill: none; stroke: #d8dee8; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 26px; font-weight: 650; }
      .body { font-size: 22px; }
      .small { font-size: 18px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 24px; font-weight: 650; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="90" y="82">Человек понимает контекст. Компьютер — только точные команды.</text>

  <rect class="panel" x="80" y="130" width="470" height="470" rx="18"/>
  <rect class="panel" x="650" y="130" width="470" height="470" rx="18"/>

  <text class="text label blue" x="255" y="185" text-anchor="middle">Человек</text>
  <text class="text label blue" x="885" y="185" text-anchor="middle">Компьютер</text>

  <circle cx="255" cy="270" r="45" fill="#eef4f8" stroke="#2f5f8f" stroke-width="4"/>
  <path class="line" d="M210 395c10-58 80-58 90 0"/>
  <path class="line" d="M230 320c20 20 35 20 50 0"/>
  <circle cx="240" cy="263" r="5" class="blue"/>
  <circle cx="270" cy="263" r="5" class="blue"/>

  <rect x="150" y="430" width="210" height="68" rx="12" class="soft-olive" stroke="#d8dee8" stroke-width="3"/>
  <text class="text body ink" x="255" y="473" text-anchor="middle">«Сделай чай»</text>
  <text class="text small muted" x="255" y="530" text-anchor="middle">контекст, опыт, догадки</text>

  <rect x="790" y="235" width="190" height="135" rx="18" class="soft-blue" stroke="#2f5f8f" stroke-width="4"/>
  <rect x="820" y="265" width="130" height="42" rx="8" fill="#ffffff" stroke="#d8dee8" stroke-width="3"/>
  <text class="text mono blue" x="885" y="294" text-anchor="middle">0101</text>
  <line class="line" x1="810" y1="400" x2="960" y2="400"/>
  <circle cx="830" cy="400" r="10" class="olive"/>
  <circle cx="880" cy="400" r="10" class="blue"/>
  <circle cx="930" cy="400" r="10" class="olive"/>

  <rect x="740" y="430" width="290" height="68" rx="12" class="soft-blue" stroke="#d8dee8" stroke-width="3"/>
  <text class="text body ink" x="885" y="473" text-anchor="middle">строгая инструкция</text>
  <text class="text small muted" x="885" y="530" text-anchor="middle">нет контекста, нет догадок</text>

  <path class="line-muted" d="M570 360h55"/>
  <path class="line" d="M610 340l25 20-25 20"/>
</svg>
