<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Результат сравнения имеет тип bool</title>
  <desc id="desc">Две схемы показывают, что сравнения 10 больше 5 и 10 меньше 5 возвращают логические значения типа bool.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:36px;font-weight:700}.big{font-family:"Cascadia Code",Consolas,monospace;font-size:48px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="62" text-anchor="middle">Результат сравнения — bool</text>
  <text class="text body muted" x="600" y="98" text-anchor="middle">bool уже знаком: это True или False</text>

  <rect class="accent" x="205" y="150" width="300" height="85" rx="18"/>
  <text class="mono blue" x="355" y="205" text-anchor="middle">10 &gt; 5</text>
  <path class="line" d="M355 242v58" marker-end="url(#arrow)"/>
  <rect class="soft" x="230" y="320" width="250" height="85" rx="18"/>
  <text class="big olive" x="355" y="377" text-anchor="middle">True</text>
  <path class="line" d="M355 412v58" marker-end="url(#arrow)"/>
  <rect class="card" x="230" y="490" width="250" height="85" rx="18"/>
  <text class="big blue" x="355" y="547" text-anchor="middle">bool</text>

  <rect class="accent" x="695" y="150" width="300" height="85" rx="18"/>
  <text class="mono blue" x="845" y="205" text-anchor="middle">10 &lt; 5</text>
  <path class="line" d="M845 242v58" marker-end="url(#arrow)"/>
  <rect class="soft" x="720" y="320" width="250" height="85" rx="18"/>
  <text class="big olive" x="845" y="377" text-anchor="middle">False</text>
  <path class="line" d="M845 412v58" marker-end="url(#arrow)"/>
  <rect class="card" x="720" y="490" width="250" height="85" rx="18"/>
  <text class="big blue" x="845" y="547" text-anchor="middle">bool</text>

  <rect class="card" x="410" y="610" width="380" height="55" rx="16"/>
  <text class="text label ink" x="600" y="647" text-anchor="middle">Сравнение создаёт значение</text>
</svg>
