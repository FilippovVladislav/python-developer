<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Присваивание и сравнение</title>
  <desc id="desc">Слева показано присваивание age = 25, справа сравнение age == 25, которое возвращает True.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:21px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:34px;font-weight:700}.big{font-family:"Cascadia Code",Consolas,monospace;font-size:54px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="62" text-anchor="middle">= и == выполняют разные задачи</text>

  <rect class="accent" x="90" y="130" width="455" height="430" rx="22"/>
  <text class="text label ink" x="318" y="188" text-anchor="middle">Присваивание</text>
  <rect class="card" x="168" y="245" width="300" height="95" rx="18"/>
  <text class="big blue" x="318" y="310" text-anchor="middle">age = 25</text>
  <path class="line" d="M318 350v55" marker-end="url(#arrow)"/>
  <rect class="soft" x="150" y="425" width="335" height="82" rx="18"/>
  <text class="text body ink" x="318" y="457" text-anchor="middle">Связать имя age</text>
  <text class="text body ink" x="318" y="488" text-anchor="middle">со значением 25</text>

  <rect class="soft" x="655" y="130" width="455" height="430" rx="22"/>
  <text class="text label ink" x="883" y="188" text-anchor="middle">Сравнение</text>
  <rect class="card" x="733" y="245" width="300" height="95" rx="18"/>
  <text class="big blue" x="883" y="310" text-anchor="middle">age == 25</text>
  <path class="line" d="M883 350v55" marker-end="url(#arrow)"/>
  <rect class="accent" x="778" y="425" width="210" height="82" rx="18"/>
  <text class="big olive" x="883" y="483" text-anchor="middle">True</text>

  <text class="text body muted" x="600" y="635" text-anchor="middle">Один знак сохраняет значение, два знака задают вопрос о значениях</text>
</svg>
