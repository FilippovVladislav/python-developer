<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Зависимости модулей проекта</title><desc id="d">main импортирует receipts, а receipts использует discounts; зависимости идут в одном направлении.</desc><defs><style>.bg{fill:#101827}.c{fill:#182538;stroke:#35d6c5;stroke-width:2}.h{font:700 26px Arial,sans-serif;fill:#f1f5f9}.code{font:21px Consolas,monospace;fill:#65e6d4}.lbl{font:19px Arial,sans-serif;fill:#bac7d8}.a{stroke:#65e6d4;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#65e6d4" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1000" height="430"/><text class="h" x="500" y="50" text-anchor="middle">Зависимости идут от сценария к логике</text><rect class="c" x="80" y="145" width="230" height="130" rx="16"/><text class="h" x="195" y="195" text-anchor="middle">main.py</text><text class="code" x="195" y="235" text-anchor="middle">create_receipt()</text><path class="a" d="M315 210h100"/><text class="lbl" x="365" y="190" text-anchor="middle">импорт</text><rect class="c" x="430" y="145" width="230" height="130" rx="16"/><text class="h" x="545" y="195" text-anchor="middle">receipts.py</text><text class="code" x="545" y="235" text-anchor="middle">apply_discount()</text><path class="a" d="M665 210h100"/><text class="lbl" x="715" y="190" text-anchor="middle">импорт</text><rect class="c" x="780" y="145" width="170" height="130" rx="16"/><text class="h" x="865" y="195" text-anchor="middle">discounts.py</text><text class="lbl" x="865" y="235" text-anchor="middle">расчёт</text><text class="lbl" x="500" y="350" text-anchor="middle">Не создавайте зависимость, которая возвращается по кругу.</text></svg>
