<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Ответственность модулей магазина</title><desc id="d">main.py управляет сценарием, pricing.py рассчитывает стоимость, validation.py проверяет ввод.</desc><defs><style>.bg{fill:#101827}.c{fill:#182538;stroke:#35d6c5;stroke-width:2}.h{font:700 27px Arial,sans-serif;fill:#f1f5f9}.code{font:21px Consolas,monospace;fill:#65e6d4}.lbl{font:19px Arial,sans-serif;fill:#bac7d8}.a{stroke:#65e6d4;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#65e6d4" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1000" height="440"/><text class="h" x="500" y="50" text-anchor="middle">Каждый модуль — своя задача</text><rect class="c" x="340" y="90" width="320" height="105" rx="16"/><text class="h" x="500" y="133" text-anchor="middle">main.py</text><text class="lbl" x="500" y="165" text-anchor="middle">сценарий программы</text><rect class="c" x="70" y="285" width="350" height="105" rx="16"/><text class="h" x="245" y="328" text-anchor="middle">pricing.py</text><text class="lbl" x="245" y="360" text-anchor="middle">расчёт стоимости</text><rect class="c" x="580" y="285" width="350" height="105" rx="16"/><text class="h" x="755" y="328" text-anchor="middle">validation.py</text><text class="lbl" x="755" y="360" text-anchor="middle">проверка данных</text><path class="a" d="M410 200 300 275"/><path class="a" d="M590 200 700 275"/></svg>
