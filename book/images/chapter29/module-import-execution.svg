<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Первый и повторный импорт</title><desc id="d">При первом импорте верхний уровень выполняется и модуль кешируется; повторный импорт использует кеш.</desc><defs><style>.bg{fill:#101827}.c{fill:#182538;stroke:#35d6c5;stroke-width:2}.h{font:700 26px Arial,sans-serif;fill:#f1f5f9}.lbl{font:20px Arial,sans-serif;fill:#bac7d8}.code{font:21px Consolas,monospace;fill:#65e6d4}.a{stroke:#65e6d4;stroke-width:4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#65e6d4" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1000" height="430"/><text class="h" x="500" y="48" text-anchor="middle">Загрузка модуля в одном процессе</text><rect class="c" x="55" y="100" width="260" height="100" rx="14"/><text class="h" x="185" y="140" text-anchor="middle">Первый import</text><text class="lbl" x="185" y="173" text-anchor="middle">код верхнего уровня</text><path class="a" d="M320 150h72"/><rect class="c" x="405" y="100" width="260" height="100" rx="14"/><text class="h" x="535" y="140" text-anchor="middle">Выполнение</text><text class="lbl" x="535" y="173" text-anchor="middle">объекты созданы</text><path class="a" d="M670 150h72"/><rect class="c" x="755" y="100" width="190" height="100" rx="14"/><text class="h" x="850" y="140" text-anchor="middle">Кеш</text><text class="lbl" x="850" y="173" text-anchor="middle">sys.modules</text><rect class="c" x="250" y="280" width="500" height="90" rx="14"/><text class="code" x="500" y="320" text-anchor="middle">повторный import</text><text class="lbl" x="500" y="350" text-anchor="middle">использует загруженный модуль, без повторного запуска</text><path class="a" d="M850 205v115h-90"/></svg>
