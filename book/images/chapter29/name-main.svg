<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Значение __name__ при запуске и импорте</title><desc id="d">При запуске файла __name__ равно main, при импорте — имени модуля.</desc><defs><style>.bg{fill:#101827}.c{fill:#182538;stroke:#35d6c5;stroke-width:2}.h{font:700 25px Arial,sans-serif;fill:#f1f5f9}.code{font:21px Consolas,monospace;fill:#65e6d4}.lbl{font:20px Arial,sans-serif;fill:#bac7d8}</style></defs><rect class="bg" width="1000" height="420"/><text class="h" x="500" y="50" text-anchor="middle">Один файл — два способа использования</text><rect class="c" x="65" y="100" width="405" height="250" rx="16"/><text class="h" x="267" y="145" text-anchor="middle">python converters.py</text><text class="code" x="105" y="205">__name__ == "__main__"</text><text class="lbl" x="105" y="250">Демонстрационный вызов выполнится</text><text class="lbl" x="105" y="290">Функция доступна внутри файла</text><rect class="c" x="530" y="100" width="405" height="250" rx="16"/><text class="h" x="732" y="145" text-anchor="middle">import converters</text><text class="code" x="570" y="205">__name__ == "converters"</text><text class="lbl" x="570" y="250">Условие ложно</text><text class="lbl" x="570" y="290">Функция импортируется без запуска демо</text></svg>
