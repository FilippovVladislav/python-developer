<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Порядок проверки elif</title>
  <desc id="desc">Для score равного 82 первая проверка score больше или равно 90 даёт False, следующая score больше или равно 75 даёт True, поэтому выбирается Хорошо и остальные ветки не проверяются.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.disabled{fill:#f6f7f9;stroke:#b9c2cd;stroke-width:3}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#b9c2cd;stroke-width:4;stroke-dasharray:10 10;stroke-linecap:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:27px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:23px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="56" text-anchor="middle">elif проверяется сверху вниз</text>

  <rect class="card" x="80" y="110" width="250" height="82" rx="16"/>
  <text class="mono blue" x="205" y="162" text-anchor="middle">score = 82</text>
  <path class="line" d="M330 151h72" marker-end="url(#arrow)"/>

  <rect class="accent" x="420" y="110" width="300" height="82" rx="16"/>
  <text class="mono blue" x="570" y="162" text-anchor="middle">82 &gt;= 90?</text>
  <path class="line" d="M720 151h72" marker-end="url(#arrow)"/>
  <rect class="alt" x="810" y="110" width="190" height="82" rx="16"/>
  <text class="mono red" x="905" y="162" text-anchor="middle">False</text>

  <path class="line" d="M905 198v55" marker-end="url(#arrow)"/>
  <rect class="accent" x="755" y="270" width="300" height="82" rx="16"/>
  <text class="mono blue" x="905" y="322" text-anchor="middle">82 &gt;= 75?</text>
  <path class="line" d="M755 311h-75" marker-end="url(#arrow)"/>
  <rect class="soft" x="470" y="270" width="190" height="82" rx="16"/>
  <text class="mono olive" x="565" y="322" text-anchor="middle">True</text>

  <path class="line" d="M565 358v58" marker-end="url(#arrow)"/>
  <rect class="soft" x="390" y="435" width="350" height="92" rx="18"/>
  <text class="text label ink" x="565" y="472" text-anchor="middle">выбрана первая</text>
  <text class="text label olive" x="565" y="506" text-anchor="middle">подходящая ветка: «Хорошо»</text>

  <path class="dash" d="M905 358v60"/>
  <rect class="disabled" x="755" y="435" width="300" height="82" rx="16"/>
  <text class="smallmono muted" x="905" y="467" text-anchor="middle">82 &gt;= 60?</text>
  <text class="text body muted" x="905" y="497" text-anchor="middle">не проверяется</text>

  <path class="dash" d="M905 522v45"/>
  <rect class="disabled" x="755" y="585" width="300" height="58" rx="16"/>
  <text class="smallmono muted" x="905" y="623" text-anchor="middle">else не нужен</text>

  <rect class="card" x="90" y="575" width="520" height="72" rx="16"/>
  <text class="text label ink" x="350" y="605" text-anchor="middle">После True остальные ветки</text>
  <text class="text body muted" x="350" y="633" text-anchor="middle">этой цепочки уже не выполняются и не проверяются</text>
</svg>
