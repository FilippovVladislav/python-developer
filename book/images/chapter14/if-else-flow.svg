<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Развилка if else</title>
  <desc id="desc">Схема показывает, что при True выполняется ветка if с сообщением Доступ разрешён, а при False выполняется ветка else с сообщением Доступ запрещён.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:31px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">if / else выбирает одну из двух веток</text>

  <rect class="accent" x="420" y="125" width="360" height="92" rx="16"/>
  <text class="mono blue" x="600" y="183" text-anchor="middle">age &gt;= 18</text>
  <path class="line" d="M575 224C505 285 420 320 340 360" marker-end="url(#arrow)"/>
  <path class="line" d="M625 224C695 285 780 320 860 360" marker-end="url(#arrow)"/>

  <rect class="soft" x="170" y="365" width="300" height="88" rx="16"/>
  <text class="mono olive" x="320" y="420" text-anchor="middle">True</text>
  <rect class="alt" x="730" y="365" width="300" height="88" rx="16"/>
  <text class="mono red" x="880" y="420" text-anchor="middle">False</text>

  <path class="line" d="M320 460v58" marker-end="url(#arrow)"/>
  <path class="line" d="M880 460v58" marker-end="url(#arrow)"/>
  <rect class="card" x="145" y="535" width="350" height="100" rx="18"/>
  <text class="text label ink" x="320" y="575" text-anchor="middle">ветка if</text>
  <text class="text label olive" x="320" y="615" text-anchor="middle">«Доступ разрешён»</text>
  <rect class="card" x="705" y="535" width="350" height="100" rx="18"/>
  <text class="text label ink" x="880" y="575" text-anchor="middle">ветка else</text>
  <text class="text label red" x="880" y="615" text-anchor="middle">«Доступ запрещён»</text>

  <text class="text body muted" x="600" y="675" text-anchor="middle">Две ветки есть в коде, но при одном запуске выполняется только одна</text>
</svg>
