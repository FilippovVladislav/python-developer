<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Как работает первый if</title>
  <desc id="desc">Схема показывает, что условие age больше или равно 18 возвращает True или False, и блок if выполняется только при True.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.skip{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:30px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:22px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">if выполняет блок только при True</text>

  <rect class="card" x="430" y="105" width="340" height="92" rx="16"/>
  <text class="mono blue" x="600" y="145" text-anchor="middle">age = 20</text>
  <text class="smallmono muted" x="600" y="177" text-anchor="middle">значение для проверки</text>
  <path class="line" d="M600 204v58" marker-end="url(#arrow)"/>

  <rect class="accent" x="420" y="280" width="360" height="88" rx="16"/>
  <text class="mono blue" x="600" y="335" text-anchor="middle">20 &gt;= 18</text>
  <path class="line" d="M575 374C500 415 420 430 340 458" marker-end="url(#arrow)"/>
  <path class="line" d="M625 374C700 415 780 430 860 458" marker-end="url(#arrow)"/>

  <rect class="soft" x="170" y="470" width="280" height="86" rx="16"/>
  <text class="mono olive" x="310" y="523" text-anchor="middle">True</text>
  <rect class="skip" x="750" y="470" width="280" height="86" rx="16"/>
  <text class="mono red" x="890" y="523" text-anchor="middle">False</text>

  <path class="line" d="M310 562v48" marker-end="url(#arrow)"/>
  <path class="line" d="M890 562v48" marker-end="url(#arrow)"/>
  <rect class="soft" x="132" y="620" width="356" height="58" rx="16"/>
  <text class="text label ink" x="310" y="657" text-anchor="middle">выполнить блок</text>
  <rect class="skip" x="712" y="620" width="356" height="58" rx="16"/>
  <text class="text label ink" x="890" y="657" text-anchor="middle">пропустить блок</text>

  <rect class="card" x="408" y="500" width="384" height="74" rx="16"/>
  <text class="smallmono blue" x="600" y="531" text-anchor="middle">print("Доступ разрешён")</text>
  <text class="text body muted" x="600" y="557" text-anchor="middle">эта строка зависит от результата условия</text>
</svg>
