<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Счётчик и накопитель</title>
  <desc id="desc">Схема показывает сумму чисел от 1 до 5: number управляет повторением, а total накапливает результат 1, 3, 6, 10, 15.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:30px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="55" text-anchor="middle">Счётчик управляет повторением, накопитель собирает результат</text>

  <rect class="accent" x="95" y="105" width="430" height="95" rx="18"/>
  <text class="bigmono blue" x="310" y="145" text-anchor="middle">number</text>
  <text class="text label ink" x="310" y="176" text-anchor="middle">счётчик: 1, 2, 3, 4, 5</text>
  <rect class="soft" x="675" y="105" width="430" height="95" rx="18"/>
  <text class="bigmono olive" x="890" y="145" text-anchor="middle">total</text>
  <text class="text label ink" x="890" y="176" text-anchor="middle">накопитель: сумма растёт</text>

  <rect class="card" x="95" y="265" width="180" height="85" rx="16"/>
  <text class="mono blue" x="185" y="300" text-anchor="middle">number 1</text>
  <text class="mono olive" x="185" y="330" text-anchor="middle">total 1</text>
  <path class="line" d="M280 308h42" marker-end="url(#arrow)"/>

  <rect class="card" x="340" y="265" width="180" height="85" rx="16"/>
  <text class="mono blue" x="430" y="300" text-anchor="middle">number 2</text>
  <text class="mono olive" x="430" y="330" text-anchor="middle">total 3</text>
  <path class="line" d="M525 308h42" marker-end="url(#arrow)"/>

  <rect class="card" x="585" y="265" width="180" height="85" rx="16"/>
  <text class="mono blue" x="675" y="300" text-anchor="middle">number 3</text>
  <text class="mono olive" x="675" y="330" text-anchor="middle">total 6</text>
  <path class="line" d="M770 308h42" marker-end="url(#arrow)"/>

  <rect class="card" x="830" y="265" width="180" height="85" rx="16"/>
  <text class="mono blue" x="920" y="300" text-anchor="middle">number 4</text>
  <text class="mono olive" x="920" y="330" text-anchor="middle">total 10</text>
  <path class="line" d="M920 358v52" marker-end="url(#arrow)"/>

  <rect class="soft" x="690" y="425" width="460" height="90" rx="18"/>
  <text class="mono blue" x="920" y="462" text-anchor="middle">number 5 → total 15</text>
  <text class="text label ink" x="920" y="492" text-anchor="middle">итоговая сумма готова</text>

  <rect class="card" x="120" y="430" width="430" height="85" rx="18"/>
  <text class="mono blue" x="335" y="465" text-anchor="middle">total += number</text>
  <text class="text body muted" x="335" y="494" text-anchor="middle">каждая итерация добавляет текущее число</text>
  <text class="text body muted" x="600" y="640" text-anchor="middle">number после цикла станет 6, а total останется 15</text>
</svg>
