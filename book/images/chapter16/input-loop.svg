<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Повторный ввод с while</title>
  <desc id="desc">Схема показывает ввод пароля, проверку password равно correct_password, повторный запрос при ответе нет и доступ разрешён при ответе да.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.no{fill:none;stroke:#c9553d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.yes{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:23px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9553d"/></marker>
    <marker id="arrow-yes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="55" text-anchor="middle">while повторяет ввод до подходящего значения</text>

  <rect class="accent" x="420" y="95" width="360" height="76" rx="16"/>
  <text class="text label ink" x="600" y="142" text-anchor="middle">Введите пароль</text>
  <path class="line" d="M600 178v55" marker-end="url(#arrow)"/>

  <rect class="card" x="350" y="250" width="500" height="86" rx="16"/>
  <text class="mono blue" x="600" y="302" text-anchor="middle">password == correct_password?</text>

  <path class="no" d="M500 343C395 385 335 408 275 455" marker-end="url(#arrow-no)"/>
  <text class="text label red" x="390" y="392" text-anchor="middle">нет</text>
  <rect class="alt" x="105" y="470" width="340" height="76" rx="16"/>
  <text class="text label ink" x="275" y="518" text-anchor="middle">спросить снова</text>
  <path class="line" d="M275 553C275 630 925 630 925 292C925 250 887 238 856 250" marker-end="url(#arrow)"/>

  <path class="yes" d="M700 343C805 385 865 408 925 455" marker-end="url(#arrow-yes)"/>
  <text class="text label olive" x="810" y="392" text-anchor="middle">да</text>
  <rect class="soft" x="755" y="470" width="340" height="76" rx="16"/>
  <text class="text label ink" x="925" y="518" text-anchor="middle">Доступ разрешён</text>

  <text class="text body muted" x="600" y="665" text-anchor="middle">После неверного значения программа возвращается к той же проверке</text>
</svg>
