<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">update и pop у словаря</title>
  <desc id="desc">update применяет изменения: существующий city меняется, новый age добавляется. pop возвращает значение city и удаляет ключ из словаря.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:20px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">update() применяет изменения, pop() извлекает и удаляет</text>

  <rect class="card" x="55" y="110" width="520" height="455" rx="18"/>
  <text class="mono blue" x="315" y="155" text-anchor="middle">profile.update(changes)</text>
  <rect class="accent" x="90" y="195" width="200" height="116" rx="14"/>
  <text class="text label ink" x="190" y="230" text-anchor="middle">было</text>
  <text class="smallmono blue" x="190" y="265" text-anchor="middle">city: Казань</text>
  <text class="smallmono blue" x="190" y="295" text-anchor="middle">name: Анна</text>
  <rect class="soft" x="340" y="195" width="200" height="116" rx="14"/>
  <text class="text label ink" x="440" y="230" text-anchor="middle">changes</text>
  <text class="smallmono olive" x="440" y="265" text-anchor="middle">city: Москва</text>
  <text class="smallmono olive" x="440" y="295" text-anchor="middle">age: 25</text>
  <path class="line" d="M315 328v60" marker-end="url(#arrow)"/>
  <rect class="card" x="150" y="405" width="330" height="112" rx="14"/>
  <text class="smallmono blue" x="315" y="440" text-anchor="middle">name: Анна</text>
  <text class="smallmono olive" x="315" y="472" text-anchor="middle">city: Москва</text>
  <text class="smallmono olive" x="315" y="504" text-anchor="middle">age: 25</text>

  <rect class="card" x="625" y="110" width="520" height="455" rx="18"/>
  <text class="mono blue" x="885" y="155" text-anchor="middle">city = profile.pop("city")</text>
  <rect class="accent" x="705" y="210" width="360" height="86" rx="14"/>
  <text class="smallmono blue" x="885" y="262" text-anchor="middle">profile содержит city</text>
  <path class="line" d="M885 310v54" marker-end="url(#arrow)"/>
  <rect class="soft" x="665" y="385" width="210" height="86" rx="14"/>
  <text class="text label ink" x="770" y="421" text-anchor="middle">возвращено</text>
  <text class="smallmono olive" x="770" y="455" text-anchor="middle">"Москва"</text>
  <rect class="alt" x="895" y="385" width="210" height="86" rx="14"/>
  <text class="text label ink" x="1000" y="421" text-anchor="middle">удалено</text>
  <text class="smallmono red" x="1000" y="455" text-anchor="middle">ключ city</text>

  <rect class="soft" x="220" y="612" width="760" height="56" rx="14"/>
  <text class="text label ink" x="600" y="648" text-anchor="middle">update() меняет словарь, pop() ещё и отдаёт удалённое значение</text>
</svg>
