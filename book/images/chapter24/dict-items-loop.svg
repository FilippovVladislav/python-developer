<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">items и распаковка в цикле</title>
  <desc id="desc">user.items возвращает пары, а цикл for key, value распаковывает каждую пару в две переменные.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:21px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">items() + распаковка дают ключ и значение вместе</text>

  <rect class="accent" x="150" y="112" width="300" height="78" rx="16"/>
  <text class="mono blue" x="300" y="162" text-anchor="middle">user.items()</text>
  <path class="line" d="M455 151h95" marker-end="url(#arrow)"/>
  <rect class="card" x="575" y="95" width="320" height="116" rx="18"/>
  <text class="smallmono blue" x="735" y="142" text-anchor="middle">("name", "Анна")</text>
  <text class="smallmono blue" x="735" y="177" text-anchor="middle">("age", 25)</text>

  <path class="line" d="M735 222v70" marker-end="url(#arrow)"/>
  <rect class="soft" x="315" y="315" width="570" height="78" rx="16"/>
  <text class="mono olive" x="600" y="365" text-anchor="middle">for key, value in user.items()</text>

  <path class="step" d="M575 405C515 448 455 485 395 528" marker-end="url(#arrow-olive)"/>
  <path class="step" d="M625 405C685 448 745 485 805 528" marker-end="url(#arrow-olive)"/>

  <rect class="card" x="245" y="530" width="300" height="88" rx="16"/>
  <text class="mono blue" x="395" y="566" text-anchor="middle">key</text>
  <text class="smallmono olive" x="395" y="600" text-anchor="middle">"name"</text>

  <rect class="card" x="655" y="530" width="300" height="88" rx="16"/>
  <text class="mono blue" x="805" y="566" text-anchor="middle">value</text>
  <text class="smallmono olive" x="805" y="600" text-anchor="middle">"Анна"</text>

  <text class="text label ink" x="600" y="665" text-anchor="middle">Каждая пара ведёт себя как кортеж из двух элементов</text>
</svg>
