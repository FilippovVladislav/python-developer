<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Один оператор и разные типы</title>
  <desc id="desc">Знак плюс приводит к сложению чисел 10 и 5, но объединяет строки Py и thon.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 42px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="78" text-anchor="middle">Один оператор может иметь разный смысл</text>

  <circle cx="600" cy="335" r="54" fill="#eef4f8" stroke="#2f5f8f" stroke-width="4"/>
  <text class="mono blue" x="600" y="350" text-anchor="middle">+</text>

  <rect class="card" x="90" y="185" width="390" height="130" rx="20"/>
  <text class="mono ink" x="285" y="260" text-anchor="middle">10 + 5</text>
  <path class="line" d="M285 330v66" marker-end="url(#arrow)"/>
  <rect class="soft" x="140" y="415" width="290" height="110" rx="18"/>
  <text class="mono ink" x="285" y="462" text-anchor="middle">15</text>
  <text class="text label olive" x="285" y="500" text-anchor="middle">Числа → сложение</text>

  <rect class="card" x="720" y="185" width="390" height="130" rx="20"/>
  <text class="mono ink" x="915" y="260" text-anchor="middle">"Py" + "thon"</text>
  <path class="line" d="M915 330v66" marker-end="url(#arrow)"/>
  <rect class="soft" x="770" y="415" width="290" height="110" rx="18"/>
  <text class="mono ink" x="915" y="462" text-anchor="middle">"Python"</text>
  <text class="text label olive" x="915" y="500" text-anchor="middle">Строки → объединение</text>

  <text class="text body muted" x="600" y="610" text-anchor="middle">Python выбирает действие по типам значений</text>
</svg>
