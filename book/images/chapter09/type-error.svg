<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TypeError при несовместимых типах</title>
  <desc id="desc">Python видит число 10 типа int и строку 5 типа str, не угадывает между вариантами 15 и 105 и сообщает TypeError.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .warn { fill: #fff4f1; stroke: #c9553d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .red { fill: #c9553d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line-red { fill: none; stroke: #c9553d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 40px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#c9553d"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="78" text-anchor="middle">Python не угадывает неоднозначные операции</text>

  <rect class="card" x="175" y="195" width="230" height="120" rx="18"/>
  <text class="mono ink" x="290" y="248" text-anchor="middle">10</text>
  <text class="text label olive" x="290" y="288" text-anchor="middle">int</text>

  <circle cx="600" cy="255" r="48" fill="#eef4f8" stroke="#2f5f8f" stroke-width="4"/>
  <text class="mono blue" x="600" y="270" text-anchor="middle">+</text>

  <rect class="card" x="795" y="195" width="230" height="120" rx="18"/>
  <text class="mono ink" x="910" y="248" text-anchor="middle">"5"</text>
  <text class="text label olive" x="910" y="288" text-anchor="middle">str</text>

  <path class="line-red" d="M600 325v82" marker-end="url(#arrow-red)"/>
  <rect class="warn" x="425" y="430" width="350" height="105" rx="18"/>
  <text class="mono red" x="600" y="494" text-anchor="middle">TypeError</text>

  <rect class="accent" x="110" y="535" width="300" height="82" rx="16"/>
  <text class="text body muted" x="260" y="567" text-anchor="middle">Человек может ожидать</text>
  <text class="mono blue" x="260" y="602" text-anchor="middle">15 ?</text>

  <rect class="accent" x="790" y="535" width="300" height="82" rx="16"/>
  <text class="text body muted" x="940" y="567" text-anchor="middle">Или другой вариант</text>
  <text class="mono blue" x="940" y="602" text-anchor="middle">105 ?</text>

  <text class="text body muted" x="600" y="650" text-anchor="middle">TypeError помогает увидеть проблему с типами данных</text>
</svg>
