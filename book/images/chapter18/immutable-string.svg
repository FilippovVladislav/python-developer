<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Неизменяемость строк</title>
  <desc id="desc">Слева показана ошибка при попытке изменить символ строки по индексу. Справа показано создание новой строки Jython через объединение J и среза word[1:].</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bad{fill:none;stroke:#c9553d;stroke-width:6;stroke-linecap:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:27px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:23px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Строки неизменяемы</text>

  <rect class="card" x="70" y="105" width="500" height="515" rx="18"/>
  <text class="text label ink" x="320" y="152" text-anchor="middle">Изменить символ по индексу нельзя</text>
  <rect class="accent" x="120" y="190" width="400" height="92" rx="14"/>
  <text class="mono blue" x="320" y="228" text-anchor="middle">word = "Python"</text>
  <text class="mono blue" x="320" y="260" text-anchor="middle">word[0] = "J"</text>
  <path class="line" d="M320 292v56" marker-end="url(#arrow)"/>
  <rect class="alt" x="160" y="370" width="320" height="82" rx="14"/>
  <text class="mono red" x="320" y="421" text-anchor="middle">TypeError</text>
  <path class="bad" d="M235 502l170 65M405 502l-170 65"/>
  <text class="text body muted" x="320" y="595" text-anchor="middle">Символ существующей строки</text>
  <text class="text body muted" x="320" y="622" text-anchor="middle">изменить нельзя</text>

  <rect class="card" x="630" y="105" width="500" height="515" rx="18"/>
  <text class="text label ink" x="880" y="152" text-anchor="middle">Новую строку создать можно</text>
  <rect class="soft" x="680" y="190" width="400" height="92" rx="14"/>
  <text class="smallmono olive" x="880" y="228" text-anchor="middle">"J" + word[1:]</text>
  <text class="text body muted" x="880" y="260" text-anchor="middle">буква + срез без первого символа</text>
  <path class="line" d="M880 292v56" marker-end="url(#arrow)"/>
  <rect class="accent" x="720" y="370" width="320" height="82" rx="14"/>
  <text class="mono blue" x="880" y="421" text-anchor="middle">"Jython"</text>
  <path class="line" d="M880 462v48" marker-end="url(#arrow)"/>
  <rect class="soft" x="705" y="530" width="350" height="64" rx="14"/>
  <text class="mono olive" x="880" y="571" text-anchor="middle">new_word</text>

  <text class="text body muted" x="600" y="665" text-anchor="middle">Нельзя изменить символ существующего объекта, но можно связать имя с новой строкой</text>
</svg>
