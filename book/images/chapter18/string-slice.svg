<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Срез строки Python</title>
  <desc id="desc">Схема показывает срез word[1:4] для строки Python. В результат входят символы y, t, h, а индекс 4 не включается.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.mark{fill:none;stroke:#c9553d;stroke-width:4;stroke-linecap:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.small{font-size:18px;font-weight:650}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:28px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:40px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Срез получает часть строки</text>
  <text class="text body muted" x="600" y="92" text-anchor="middle">Правая граница stop не включается</text>

  <rect class="accent" x="165" y="122" width="870" height="72" rx="16"/>
  <text class="mono blue" x="600" y="168" text-anchor="middle">word = "Python"     word[1:4]</text>

  <g>
    <rect class="card" x="165" y="260" width="110" height="78" rx="12"/><text class="bigmono blue" x="220" y="312" text-anchor="middle">P</text><text class="mono muted" x="220" y="372" text-anchor="middle">0</text>
    <rect class="soft" x="305" y="260" width="110" height="78" rx="12"/><text class="bigmono olive" x="360" y="312" text-anchor="middle">y</text><text class="mono blue" x="360" y="372" text-anchor="middle">1</text>
    <rect class="soft" x="445" y="260" width="110" height="78" rx="12"/><text class="bigmono olive" x="500" y="312" text-anchor="middle">t</text><text class="mono blue" x="500" y="372" text-anchor="middle">2</text>
    <rect class="soft" x="585" y="260" width="110" height="78" rx="12"/><text class="bigmono olive" x="640" y="312" text-anchor="middle">h</text><text class="mono blue" x="640" y="372" text-anchor="middle">3</text>
    <rect class="alt" x="725" y="260" width="110" height="78" rx="12"/><text class="bigmono red" x="780" y="312" text-anchor="middle">o</text><text class="mono red" x="780" y="372" text-anchor="middle">4</text>
    <rect class="card" x="865" y="260" width="110" height="78" rx="12"/><text class="bigmono blue" x="920" y="312" text-anchor="middle">n</text><text class="mono muted" x="920" y="372" text-anchor="middle">5</text>
  </g>

  <path class="line" d="M360 392v38" marker-end="url(#arrow)"/>
  <path class="line" d="M640 392v38" marker-end="url(#arrow)"/>
  <path class="mark" d="M780 402v42"/>

  <rect class="soft" x="225" y="455" width="270" height="58" rx="12"/>
  <text class="text label olive" x="360" y="492" text-anchor="middle">start = 1</text>

  <rect class="soft" x="515" y="455" width="250" height="58" rx="12"/>
  <text class="text small olive" x="640" y="492" text-anchor="middle">индексы 1, 2, 3 входят</text>

  <rect class="alt" x="785" y="455" width="285" height="58" rx="12"/>
  <text class="text small red" x="928" y="492" text-anchor="middle">stop = 4 не включается</text>

  <rect class="soft" x="380" y="540" width="440" height="72" rx="16"/>
  <text class="mono olive" x="600" y="586" text-anchor="middle">word[1:4] → "yth"</text>

  <text class="mono blue" x="370" y="655" text-anchor="middle">word[:3] → "Pyt"</text>
  <text class="mono blue" x="830" y="655" text-anchor="middle">word[2:] → "thon"</text>
</svg>
