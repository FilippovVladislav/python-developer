<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Готовый модуль Python</title>
  <desc id="desc">Программа импортирует math и использует math.sqrt для вычисления квадратного корня.</desc>
  <defs><style>
    .bg{fill:#101827}.card{fill:#182538;stroke:#35d6c5;stroke-width:2}.title{font:700 34px Arial,sans-serif;fill:#f1f5f9}.label{font:22px Arial,sans-serif;fill:#bac7d8}.code{font:700 27px Consolas,monospace;fill:#65e6d4}.result{font:700 30px Consolas,monospace;fill:#f1f5f9}.arrow{stroke:#65e6d4;stroke-width:4;fill:none;marker-end:url(#a)}
  </style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#65e6d4" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="1200" height="760"/><text class="title" x="600" y="62" text-anchor="middle">Используем готовый код Python</text>
  <g><rect class="card" x="290" y="105" width="620" height="84" rx="16"/><text class="label" x="600" y="157" text-anchor="middle">Python-программа</text></g>
  <path class="arrow" d="M600 191v40"/><g><rect class="card" x="290" y="235" width="620" height="84" rx="16"/><text class="code" x="600" y="289" text-anchor="middle">import math</text></g>
  <path class="arrow" d="M600 321v40"/><g><rect class="card" x="290" y="365" width="620" height="84" rx="16"/><text class="label" x="600" y="417" text-anchor="middle">готовый модуль</text></g>
  <path class="arrow" d="M600 451v40"/><g><rect class="card" x="290" y="495" width="620" height="84" rx="16"/><text class="code" x="600" y="549" text-anchor="middle">math.sqrt(81)</text></g>
  <path class="arrow" d="M600 581v40"/><g><rect class="card" x="290" y="625" width="620" height="84" rx="16"/><text class="result" x="600" y="679" text-anchor="middle">9.0</text></g>
</svg>
