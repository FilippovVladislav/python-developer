<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Как input возвращает строку в переменную</title>
  <desc id="desc">Программа вызывает input, пользователь вводит Анна, input возвращает строку Анна, значение сохраняется в переменной name.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 26px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="70" text-anchor="middle">Как работает input()</text>

  <rect class="card" x="325" y="115" width="550" height="70" rx="16"/>
  <text class="text label blue" x="600" y="160" text-anchor="middle">Программа дошла до вопроса</text>
  <path class="line" d="M600 190v35" marker-end="url(#arrow)"/>

  <rect class="accent" x="325" y="240" width="550" height="78" rx="16"/>
  <text class="mono ink" x="600" y="289" text-anchor="middle">input("Как вас зовут? ")</text>
  <path class="line" d="M600 323v35" marker-end="url(#arrow)"/>

  <rect class="soft" x="325" y="373" width="550" height="82" rx="16"/>
  <text class="text body muted" x="600" y="405" text-anchor="middle">Пользователь вводит</text>
  <text class="mono olive" x="600" y="438" text-anchor="middle">Анна</text>
  <path class="line" d="M600 460v35" marker-end="url(#arrow)"/>

  <rect class="card" x="325" y="510" width="550" height="76" rx="16"/>
  <text class="text body muted" x="600" y="540" text-anchor="middle">input() возвращает строку</text>
  <text class="mono blue" x="600" y="572" text-anchor="middle">"Анна"</text>
  <path class="line" d="M600 590v32" marker-end="url(#arrow)"/>

  <rect class="accent" x="450" y="633" width="300" height="52" rx="14"/>
  <text class="mono ink" x="600" y="668" text-anchor="middle">name</text>
</svg>
