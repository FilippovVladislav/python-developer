<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">input всегда возвращает строку</title>
  <desc id="desc">Вводы Анна, 25, 3.14 и True после input становятся строками Анна, 25, 3.14 и True с типом str.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 28px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="76" text-anchor="middle">input() всегда возвращает строку</text>
  <text class="text body muted" x="600" y="120" text-anchor="middle">Python не угадывает смысл введённых символов</text>

  <g transform="translate(90 185)">
    <rect class="card" width="210" height="70" rx="14"/>
    <text class="mono ink" x="105" y="46" text-anchor="middle">Анна</text>
    <path class="line" d="M215 35h160" marker-end="url(#arrow)"/>
    <rect class="soft" x="405" width="230" height="70" rx="14"/>
    <text class="mono olive" x="520" y="46" text-anchor="middle">"Анна"</text>
    <path class="line" d="M640 35h185" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(90 285)">
    <rect class="card" width="210" height="70" rx="14"/>
    <text class="mono ink" x="105" y="46" text-anchor="middle">25</text>
    <path class="line" d="M215 35h160" marker-end="url(#arrow)"/>
    <rect class="soft" x="405" width="230" height="70" rx="14"/>
    <text class="mono olive" x="520" y="46" text-anchor="middle">"25"</text>
    <path class="line" d="M640 35h185" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(90 385)">
    <rect class="card" width="210" height="70" rx="14"/>
    <text class="mono ink" x="105" y="46" text-anchor="middle">3.14</text>
    <path class="line" d="M215 35h160" marker-end="url(#arrow)"/>
    <rect class="soft" x="405" width="230" height="70" rx="14"/>
    <text class="mono olive" x="520" y="46" text-anchor="middle">"3.14"</text>
    <path class="line" d="M640 35h185" marker-end="url(#arrow)"/>
  </g>
  <g transform="translate(90 485)">
    <rect class="card" width="210" height="70" rx="14"/>
    <text class="mono ink" x="105" y="46" text-anchor="middle">True</text>
    <path class="line" d="M215 35h160" marker-end="url(#arrow)"/>
    <rect class="soft" x="405" width="230" height="70" rx="14"/>
    <text class="mono olive" x="520" y="46" text-anchor="middle">"True"</text>
    <path class="line" d="M640 35h185" marker-end="url(#arrow)"/>
  </g>

  <rect class="accent" x="925" y="285" width="180" height="170" rx="20"/>
  <text class="mono blue" x="1015" y="358" text-anchor="middle">str</text>
  <text class="text body muted" x="1015" y="400" text-anchor="middle">тип результата</text>
</svg>
