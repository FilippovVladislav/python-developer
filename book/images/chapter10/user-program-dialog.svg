<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Диалог пользователя и программы</title>
  <desc id="desc">print передаёт информацию от программы к пользователю, input получает информацию от пользователя для программы.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .line-olive { fill: none; stroke: #6f7d2d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 25px; font-weight: 650; }
      .body { font-size: 21px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 31px; font-weight: 700; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6f7d2d"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="82" text-anchor="middle">Программа и пользователь обмениваются данными</text>

  <rect class="soft" x="105" y="260" width="270" height="170" rx="20"/>
  <text class="text label ink" x="240" y="335" text-anchor="middle">Пользователь</text>
  <text class="text body muted" x="240" y="375" text-anchor="middle">вводит данные</text>

  <rect class="accent" x="825" y="260" width="270" height="170" rx="20"/>
  <text class="text label ink" x="960" y="335" text-anchor="middle">Программа</text>
  <text class="text body muted" x="960" y="375" text-anchor="middle">использует данные</text>

  <path class="line" d="M390 292h420" marker-end="url(#arrow-blue)"/>
  <rect class="card" x="500" y="225" width="200" height="58" rx="14"/>
  <text class="mono blue" x="600" y="264" text-anchor="middle">input()</text>
  <text class="text body muted" x="600" y="205" text-anchor="middle">получить информацию</text>

  <path class="line-olive" d="M810 407H390" marker-end="url(#arrow-olive)"/>
  <rect class="card" x="500" y="417" width="200" height="58" rx="14"/>
  <text class="mono olive" x="600" y="456" text-anchor="middle">print()</text>
  <text class="text body muted" x="600" y="505" text-anchor="middle">показать информацию</text>
</svg>
