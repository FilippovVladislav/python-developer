<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Разные языки подходят для разных задач</title>
  <desc id="desc">Разные области разработки связаны с разными языками и компромиссами.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .center { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 26px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="78" text-anchor="middle">Много языков существует из-за разных задач</text>

  <rect class="center" x="455" y="280" width="290" height="110" rx="20"/>
  <text class="text label ink" x="600" y="325" text-anchor="middle">Разные задачи</text>
  <text class="text body muted" x="600" y="358" text-anchor="middle">разные компромиссы</text>

  <g>
    <rect class="card" x="95" y="150" width="270" height="92" rx="16"/>
    <text class="text label blue" x="230" y="188" text-anchor="middle">Системное</text>
    <text class="text body muted" x="230" y="218" text-anchor="middle">C</text>
    <path class="line" d="M365 215l90 95"/>
  </g>

  <g>
    <rect class="card" x="835" y="150" width="270" height="92" rx="16"/>
    <text class="text label blue" x="970" y="188" text-anchor="middle">Веб</text>
    <text class="text body muted" x="970" y="218" text-anchor="middle">JavaScript</text>
    <path class="line" d="M835 215l-90 95"/>
  </g>

  <g>
    <rect class="card" x="105" y="455" width="285" height="92" rx="16"/>
    <text class="text label blue" x="248" y="493" text-anchor="middle">Корпоративные</text>
    <text class="text body muted" x="248" y="523" text-anchor="middle">Java</text>
    <path class="line" d="M390 500l80-120"/>
  </g>

  <g>
    <rect class="card" x="815" y="455" width="285" height="92" rx="16"/>
    <text class="text label blue" x="958" y="493" text-anchor="middle">Автоматизация</text>
    <text class="text body muted" x="958" y="523" text-anchor="middle">Python</text>
    <path class="line" d="M815 500l-80-120"/>
  </g>

  <rect class="soft" x="445" y="520" width="310" height="76" rx="16"/>
  <text class="text label ink" x="600" y="552" text-anchor="middle">Обработка данных</text>
  <text class="text body muted" x="600" y="580" text-anchor="middle">Python и другие языки</text>
  <path class="line" d="M600 520v-130"/>
</svg>
