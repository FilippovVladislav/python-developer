<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Несколько обработчиков except</title><desc id="d">Один try передаёт ValueError и ZeroDivisionError соответствующим обработчикам.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65e6d4"/></marker><style>.bg{fill:#101827}.box{fill:#182538;stroke:#65e6d4;stroke-width:3}.h{font:700 26px Arial;fill:#f1f5f9}.m{font:20px Consolas;fill:#65e6d4}.b{font:19px Arial;fill:#d8e2ef}.l{stroke:#65e6d4;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1200" height="500"/><text class="h" x="600" y="52" text-anchor="middle">Один try — разные обработчики</text><rect class="box" x="390" y="90" width="420" height="100" rx="16"/><text class="m" x="600" y="132" text-anchor="middle">try: вычислить результат</text><text class="b" x="600" y="163" text-anchor="middle">int(text), затем деление</text><path class="l" d="M475 190 270 285"/><path class="l" d="M725 190 930 285"/><text class="b" x="315" y="230">неверное число</text><text class="b" x="805" y="230">нулевой делитель</text><rect class="box" x="70" y="295" width="400" height="110" rx="16"/><text class="m" x="270" y="340" text-anchor="middle">except ValueError:</text><text class="b" x="270" y="375" text-anchor="middle">попросить целое число</text><rect class="box" x="730" y="295" width="400" height="110" rx="16"/><text class="m" x="930" y="340" text-anchor="middle">except ZeroDivisionError:</text><text class="b" x="930" y="375" text-anchor="middle">сообщить о делении на ноль</text></svg>
