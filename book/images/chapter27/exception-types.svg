<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Знакомые исключения Python</title><desc id="d">Пять распространённых исключений и короткие примеры операций.</desc><defs><style>.bg{fill:#101827}.card{fill:#182538;stroke:#35d6c5;stroke-width:2}.title{font:700 32px Arial,sans-serif;fill:#f1f5f9}.name{font:700 22px Arial,sans-serif;fill:#65e6d4}.code{font:20px Consolas,monospace;fill:#f1f5f9}.note{font:16px Arial,sans-serif;fill:#bac7d8}</style></defs><rect class="bg" width="1200" height="620"/><text class="title" x="600" y="55" text-anchor="middle">Пять частых исключений</text><g transform="translate(65 95)"><rect class="card" width="510" height="135" rx="16"/><text class="name" x="24" y="42">ValueError</text><text class="code" x="24" y="82">int("пять")</text><text class="note" x="24" y="113">значение не подходит операции</text></g><g transform="translate(625 95)"><rect class="card" width="510" height="135" rx="16"/><text class="name" x="24" y="42">ZeroDivisionError</text><text class="code" x="24" y="82">10 / 0</text><text class="note" x="24" y="113">деление на ноль</text></g><g transform="translate(65 260)"><rect class="card" width="510" height="135" rx="16"/><text class="name" x="24" y="42">TypeError</text><text class="code" x="24" y="82">5 + "5"</text><text class="note" x="24" y="113">операция несовместима с типами</text></g><g transform="translate(625 260)"><rect class="card" width="510" height="135" rx="16"/><text class="name" x="24" y="42">KeyError</text><text class="code" x="24" y="82">user["age"]</text><text class="note" x="24" y="113">ключ отсутствует в словаре</text></g><g transform="translate(345 425)"><rect class="card" width="510" height="135" rx="16"/><text class="name" x="24" y="42">IndexError</text><text class="code" x="24" y="82">items[3]  # в списке один элемент</text><text class="note" x="24" y="113">индекс вне границ списка</text></g></svg>
