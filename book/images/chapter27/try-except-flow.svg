<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Поток выполнения try и except</title><desc id="d">Успешный try идёт дальше; подходящая ошибка переходит в except; необработанная ошибка остаётся ошибкой.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65e6d4"/></marker><style>.bg{fill:#101827}.box{fill:#182538;stroke:#65e6d4;stroke-width:3}.warn{fill:#342332;stroke:#ff7b9c;stroke-width:3}.h{font:700 28px Arial;fill:#f1f5f9}.b{font:20px Arial;fill:#d8e2ef}.m{font:20px Consolas;fill:#65e6d4}.line{stroke:#65e6d4;stroke-width:3;fill:none;marker-end:url(#a)}.red{stroke:#ff7b9c;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1200" height="500"/><text class="h" x="600" y="48" text-anchor="middle">Что происходит в try / except</text><rect class="box" x="420" y="85" width="360" height="100" rx="16"/><text class="m" x="600" y="127" text-anchor="middle">операция в try</text><text class="b" x="600" y="157" text-anchor="middle">например, int(text)</text><path class="line" d="M490 185 300 280"/><path class="line" d="M710 185 900 280"/><text class="b" x="345" y="224">успех</text><text class="b" x="795" y="224">подходящая ошибка</text><rect class="box" x="95" y="290" width="400" height="120" rx="16"/><text class="h" x="295" y="335" text-anchor="middle">Продолжить программу</text><text class="b" x="295" y="375" text-anchor="middle">значение доступно</text><rect class="box" x="705" y="290" width="400" height="120" rx="16"/><text class="m" x="905" y="335" text-anchor="middle">выполнить except</text><text class="b" x="905" y="375" text-anchor="middle">затем продолжить программу</text><path class="red" d="M600 185v245"/><text class="b" x="620" y="245">другой тип</text><text class="b" x="600" y="465" text-anchor="middle" fill="#ff9db2">необработанное исключение не исправляется и завершает выполнение</text></svg>
