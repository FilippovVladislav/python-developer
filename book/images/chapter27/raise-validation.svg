<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Проверка значения с raise</title><desc id="d">Допустимое значение продолжает работу, недопустимое вызывает ValueError и передаёт управление except.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65e6d4"/></marker><style>.bg{fill:#101827}.box{fill:#182538;stroke:#65e6d4;stroke-width:3}.warn{fill:#342332;stroke:#ff7b9c;stroke-width:3}.h{font:700 24px Arial;fill:#f1f5f9}.m{font:19px Consolas;fill:#65e6d4}.b{font:19px Arial;fill:#d8e2ef}.l{stroke:#65e6d4;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#ff7b9c;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1200" height="500"/><text class="h" x="600" y="50" text-anchor="middle">Проверка количества перед продолжением</text><rect class="box" x="60" y="190" width="220" height="100" rx="14"/><text class="m" x="170" y="232" text-anchor="middle">ввод</text><text class="b" x="170" y="263" text-anchor="middle">amount</text><path class="l" d="M280 240h100"/><path class="l" d="M600 190v-80h160"/><path class="r" d="M600 290v95h160"/><rect class="box" x="380" y="190" width="440" height="100" rx="14"/><text class="m" x="600" y="232" text-anchor="middle">проверка: amount &gt; 0?</text><text class="b" x="600" y="263" text-anchor="middle">условие соблюдено?</text><rect class="box" x="760" y="65" width="360" height="90" rx="14"/><text class="m" x="940" y="105" text-anchor="middle">да → продолжить работу</text><text class="b" x="940" y="133" text-anchor="middle">успешная ветка</text><rect class="warn" x="760" y="345" width="360" height="100" rx="14"/><text class="m" x="940" y="385" text-anchor="middle">нет → raise ValueError</text><text class="b" x="940" y="416" text-anchor="middle">except обрабатывает ошибку</text></svg>
