<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="t d"><title id="t">Роли try, except, else и finally</title><desc id="d">Успешная операция ведёт в else, подходящее исключение в except; finally работает в обоих случаях, но не подавляет необработанную ошибку.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#65e6d4"/></marker><style>.bg{fill:#101827}.box{fill:#182538;stroke:#65e6d4;stroke-width:3}.warn{fill:#342332;stroke:#ff7b9c;stroke-width:3}.h{font:700 25px Arial;fill:#f1f5f9}.m{font:20px Consolas;fill:#65e6d4}.b{font:19px Arial;fill:#d8e2ef}.l{stroke:#65e6d4;stroke-width:3;fill:none;marker-end:url(#a)}.r{stroke:#ff7b9c;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="bg" width="1200" height="570"/><text class="h" x="600" y="48" text-anchor="middle">Успешный и ошибочный путь</text><rect class="box" x="420" y="75" width="360" height="75" rx="14"/><text class="m" x="600" y="122" text-anchor="middle">try: операция</text><path class="l" d="M480 150 285 225"/><path class="l" d="M720 150 915 225"/><rect class="box" x="100" y="230" width="370" height="80" rx="14"/><text class="m" x="285" y="280" text-anchor="middle">else: только при успехе</text><rect class="box" x="730" y="230" width="370" height="80" rx="14"/><text class="m" x="915" y="280" text-anchor="middle">except: подходящая ошибка</text><path class="l" d="M285 310v70h315"/><path class="l" d="M915 310v70H600"/><rect class="box" x="420" y="385" width="360" height="75" rx="14"/><text class="m" x="600" y="432" text-anchor="middle">finally: всегда выполняется</text><path class="r" d="M780 110h145v390"/><text class="b" x="950" y="455">необработанное исключение</text><text class="b" x="950" y="482">проходит через finally и</text><text class="b" x="950" y="509">продолжает распространяться</text></svg>
