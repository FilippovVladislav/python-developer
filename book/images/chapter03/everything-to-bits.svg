<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Разные данные сходятся к битам</title>
  <desc id="desc">Текст, число, изображение, звук и программа превращаются в числа или коды, а затем в нули и единицы.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .middle { fill: #f0f3df; stroke: #d8dee8; stroke-width: 3; }
      .bits { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 25px; font-weight: 700; }
      .mono-large { font-family: "Cascadia Code", Consolas, monospace; font-size: 34px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="90" y="82">Разные виды информации в итоге становятся битами</text>

  <g transform="translate(90 130)">
    <rect class="card" width="285" height="72" rx="14"/>
    <text class="text label blue" x="18" y="44">Текст</text>
    <text class="mono olive" x="226" y="45">AБ</text>
  </g>

  <g transform="translate(90 225)">
    <rect class="card" width="285" height="72" rx="14"/>
    <text class="text label blue" x="18" y="44">Число</text>
    <text class="mono olive" x="226" y="45">42</text>
  </g>

  <g transform="translate(90 320)">
    <rect class="card" width="285" height="72" rx="14"/>
    <text class="text label blue" x="18" y="44">Изображение</text>
    <g transform="translate(226 18)">
      <rect width="18" height="18" fill="#d94f45"/>
      <rect x="22" width="18" height="18" fill="#6f7d2d"/>
      <rect y="22" width="18" height="18" fill="#2f5f8f"/>
      <rect x="22" y="22" width="18" height="18" fill="#e8c75f"/>
    </g>
  </g>

  <g transform="translate(90 415)">
    <rect class="card" width="285" height="72" rx="14"/>
    <text class="text label blue" x="18" y="44">Звук</text>
    <path class="line" d="M168 38c14-28 28 28 42 0s28 28 42 0"/>
  </g>

  <g transform="translate(90 510)">
    <rect class="card" width="285" height="72" rx="14"/>
    <text class="text label blue" x="18" y="44">Программа</text>
    <text class="mono olive" x="232" y="45">if</text>
  </g>

  <rect class="middle" x="475" y="265" width="250" height="150" rx="18"/>
  <text class="text label ink" x="600" y="320" text-anchor="middle">представление</text>
  <text class="text label ink" x="600" y="353" text-anchor="middle">данными</text>
  <text class="text body muted" x="600" y="390" text-anchor="middle">числа / коды</text>

  <rect class="bits" x="835" y="270" width="285" height="140" rx="18"/>
  <text class="text label ink" x="978" y="316" text-anchor="middle">биты</text>
  <text class="mono-large blue" x="978" y="365" text-anchor="middle">01001101...</text>

  <path class="line" d="M375 166c55 0 55 174 100 174"/>
  <path class="line" d="M375 261c55 0 55 79 100 79"/>
  <path class="line" d="M375 356c55 0 55-16 100-16"/>
  <path class="line" d="M375 451c55 0 55-111 100-111"/>
  <path class="line" d="M375 546c55 0 55-206 100-206"/>
  <path class="line" d="M725 340h110"/>
  <path class="line" d="M823 328l12 12-12 12"/>

  <text class="text body muted" x="600" y="635" text-anchor="middle">Тип данных меняется, но хранение сводится к числам и битам</text>
</svg>
