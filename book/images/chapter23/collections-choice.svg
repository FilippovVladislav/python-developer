<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Выбор структуры данных</title>
  <desc id="desc">Карта структур данных: list для изменяемой последовательности, tuple для фиксированной последовательности, set для уникальных значений, dict для пар ключ значение.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:21px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:23px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:32px;font-weight:800}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Структура данных выбирается по смыслу задачи</text>

  <rect class="card" x="70" y="120" width="500" height="190" rx="18"/>
  <rect class="accent" x="110" y="150" width="170" height="58" rx="14"/>
  <text class="bigmono blue" x="195" y="190" text-anchor="middle">LIST</text>
  <text class="text label ink" x="315" y="180">изменяемая</text>
  <text class="text label ink" x="315" y="210">последовательность</text>
  <text class="mono blue" x="320" y="270" text-anchor="middle">["Python", "Go"]</text>

  <rect class="card" x="630" y="120" width="500" height="190" rx="18"/>
  <rect class="soft" x="670" y="150" width="190" height="58" rx="14"/>
  <text class="bigmono olive" x="765" y="190" text-anchor="middle">TUPLE</text>
  <text class="text label ink" x="895" y="180">фиксированная</text>
  <text class="text label ink" x="895" y="210">последовательность</text>
  <text class="mono olive" x="880" y="270" text-anchor="middle">(1920, 1080)</text>

  <rect class="card" x="70" y="365" width="500" height="190" rx="18"/>
  <rect class="alt" x="110" y="395" width="170" height="58" rx="14"/>
  <text class="bigmono red" x="195" y="435" text-anchor="middle">SET</text>
  <text class="text label ink" x="315" y="425">уникальные</text>
  <text class="text label ink" x="315" y="455">значения</text>
  <text class="mono red" x="320" y="515" text-anchor="middle">{"Python", "Go"}</text>

  <rect class="card" x="630" y="365" width="500" height="190" rx="18"/>
  <rect class="accent" x="670" y="395" width="170" height="58" rx="14"/>
  <text class="bigmono blue" x="755" y="435" text-anchor="middle">DICT</text>
  <text class="text label ink" x="895" y="425">ключ</text>
  <text class="text label ink" x="895" y="455">→ значение</text>
  <text class="mono blue" x="880" y="515" text-anchor="middle">{"name": "Анна", "age": 25}</text>

  <rect class="soft" x="230" y="620" width="740" height="54" rx="14"/>
  <text class="text label ink" x="600" y="655" text-anchor="middle">Сначала вопрос к данным, потом тип коллекции</text>
</svg>
