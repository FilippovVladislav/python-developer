<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Роль интерпретатора Python</title>
  <desc id="desc">Python-код читает интерпретатор, а процессор выполняет машинные инструкции.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 650; }
      .body { font-size: 21px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 24px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="90" y="82">Процессор не выполняет исходный текст Python напрямую</text>

  <rect class="card" x="90" y="220" width="235" height="170" rx="18"/>
  <text class="text label blue" x="207" y="265" text-anchor="middle">hello.py</text>
  <rect x="125" y="295" width="165" height="56" rx="10" fill="#eef4f8" stroke="#d8dee8" stroke-width="3"/>
  <text class="mono blue" x="207" y="330" text-anchor="middle">print("Привет")</text>

  <rect class="soft" x="430" y="205" width="280" height="200" rx="20"/>
  <text class="text label ink" x="570" y="265" text-anchor="middle">Интерпретатор</text>
  <text class="text label ink" x="570" y="298" text-anchor="middle">Python</text>
  <text class="text body muted" x="570" y="350" text-anchor="middle">читает Python-код</text>

  <rect class="card" x="790" y="220" width="300" height="170" rx="18"/>
  <text class="text label blue" x="940" y="265" text-anchor="middle">машинные инструкции</text>
  <text class="mono olive" x="940" y="315" text-anchor="middle">10110000</text>
  <text class="mono olive" x="940" y="350" text-anchor="middle">01001101</text>

  <rect class="accent" x="835" y="470" width="210" height="95" rx="18"/>
  <text class="text label ink" x="940" y="525" text-anchor="middle">CPU</text>

  <path class="line" d="M325 305h105"/>
  <path class="line" d="M418 293l12 12-12 12"/>
  <path class="line" d="M710 305h80"/>
  <path class="line" d="M778 293l12 12-12 12"/>
  <path class="line" d="M940 390v80"/>
  <path class="line" d="M928 458l12 12 12-12"/>

  <text class="text body muted" x="600" y="630" text-anchor="middle">Python-код обрабатывает интерпретатор, а CPU выполняет инструкции нижнего уровня</text>
</svg>
