<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Кортеж из одного элемента</title>
  <desc id="desc">Схема показывает, что запись (10) даёт int, запись (10,) даёт tuple, а запись 10, 20 тоже создаёт tuple.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.bad{fill:none;stroke:#c9553d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:31px;font-weight:800}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9553d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Кортеж из одного элемента создаёт запятая</text>
  <text class="text body muted" x="600" y="92" text-anchor="middle">Скобки помогают читать запись, но важна запятая</text>

  <rect class="card" x="90" y="135" width="320" height="370" rx="18"/>
  <rect class="alt" x="130" y="175" width="240" height="78" rx="14"/>
  <text class="mono red" x="250" y="225" text-anchor="middle">(10)</text>
  <path class="bad" d="M250 265v66" marker-end="url(#arrow-red)"/>
  <rect class="alt" x="145" y="350" width="210" height="78" rx="14"/>
  <text class="mono red" x="250" y="400" text-anchor="middle">int</text>

  <rect class="card" x="440" y="135" width="320" height="370" rx="18"/>
  <rect class="soft" x="480" y="175" width="240" height="78" rx="14"/>
  <text class="mono olive" x="600" y="225" text-anchor="middle">(10,)</text>
  <path class="line" d="M600 265v66" marker-end="url(#arrow)"/>
  <rect class="soft" x="495" y="350" width="210" height="78" rx="14"/>
  <text class="mono olive" x="600" y="400" text-anchor="middle">tuple</text>

  <rect class="card" x="790" y="135" width="320" height="370" rx="18"/>
  <rect class="accent" x="830" y="165" width="240" height="66" rx="14"/>
  <text class="smallmono blue" x="950" y="207" text-anchor="middle">10, 20</text>
  <path class="line" d="M950 242v40" marker-end="url(#arrow)"/>
  <rect class="soft" x="830" y="300" width="240" height="66" rx="14"/>
  <text class="smallmono olive" x="950" y="342" text-anchor="middle">(10, 20)</text>
  <path class="line" d="M950 375v36" marker-end="url(#arrow)"/>
  <rect class="soft" x="845" y="428" width="210" height="58" rx="14"/>
  <text class="smallmono olive" x="950" y="466" text-anchor="middle">tuple</text>

  <rect class="accent" x="175" y="570" width="850" height="64" rx="16"/>
  <text class="text label ink" x="600" y="611" text-anchor="middle">Обычно пишем скобки для ясности: (10, 20)</text>
</svg>
