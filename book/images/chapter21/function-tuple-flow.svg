<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Функция возвращает tuple</title>
  <desc id="desc">Функция get_min_max возвращает min и max через запятую. Python получает кортеж 5, 30, затем он распаковывается в minimum и maximum.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:23px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:20px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:30px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Функция может вернуть несколько значений как tuple</text>
  <text class="text body muted" x="600" y="92" text-anchor="middle">Это мост от функций к кортежам и распаковке</text>

  <rect class="card" x="70" y="120" width="500" height="470" rx="18"/>
  <text class="text label ink" x="320" y="160" text-anchor="middle">функция</text>
  <rect class="accent" x="110" y="190" width="420" height="165" rx="14"/>
  <text class="smallmono blue" x="320" y="235" text-anchor="middle">def get_min_max(numbers):</text>
  <text class="smallmono blue" x="320" y="280" text-anchor="middle">    return min(numbers),</text>
  <text class="smallmono blue" x="320" y="320" text-anchor="middle">           max(numbers)</text>
  <path class="line" d="M320 365v50" marker-end="url(#arrow)"/>
  <rect class="soft" x="185" y="432" width="270" height="62" rx="14"/>
  <text class="mono olive" x="320" y="472" text-anchor="middle">return 5, 30</text>

  <path class="line" d="M570 463h80" marker-end="url(#arrow)"/>
  <rect class="card" x="670" y="250" width="450" height="290" rx="18"/>
  <rect class="soft" x="775" y="285" width="240" height="64" rx="14"/>
  <text class="bigmono olive" x="895" y="327" text-anchor="middle">(5, 30)</text>
  <text class="text label ink" x="895" y="388" text-anchor="middle">tuple</text>
  <path class="line" d="M895 405v42" marker-end="url(#arrow)"/>
  <rect class="accent" x="775" y="465" width="240" height="52" rx="14"/>
  <text class="text label ink" x="895" y="499" text-anchor="middle">распаковка</text>

  <path class="step" d="M835 520C790 555 760 590 725 625" marker-end="url(#arrow-olive)"/>
  <path class="step" d="M955 520C1000 555 1030 590 1065 625" marker-end="url(#arrow-olive)"/>
  <text class="text label ink" x="725" y="655" text-anchor="middle">minimum = 5</text>
  <text class="text label ink" x="1065" y="655" text-anchor="middle">maximum = 30</text>
</svg>
