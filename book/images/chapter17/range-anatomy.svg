<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Формы range</title>
  <desc id="desc">Схема показывает range с одним, двумя и тремя аргументами: stop не включается, start задаёт первое значение, step задаёт шаг.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.false{fill:none;stroke:#c9553d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:19px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-false" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9553d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="54" text-anchor="middle">range() задаёт последовательность целых значений</text>

  <rect class="accent" x="70" y="115" width="270" height="430" rx="18"/>
  <text class="mono blue" x="205" y="170" text-anchor="middle">range(5)</text>
  <text class="text body muted" x="205" y="205" text-anchor="middle">stop = 5</text>
  <text class="text label red" x="205" y="248" text-anchor="middle">5 не включается</text>
  <g>
    <rect class="soft" x="95" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="121" y="329" text-anchor="middle">0</text>
    <rect class="soft" x="155" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="181" y="329" text-anchor="middle">1</text>
    <rect class="soft" x="215" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="241" y="329" text-anchor="middle">2</text>
    <rect class="soft" x="275" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="301" y="329" text-anchor="middle">3</text>
    <rect class="soft" x="95" y="370" width="52" height="42" rx="9"/><text class="mono olive" x="121" y="399" text-anchor="middle">4</text>
    <rect class="alt" x="155" y="370" width="52" height="42" rx="9"/><text class="mono red" x="181" y="399" text-anchor="middle">5</text>
  </g>
  <path class="false" d="M181 420v44" marker-end="url(#arrow-false)"/>
  <text class="text body red" x="205" y="498" text-anchor="middle">граница, не значение</text>

  <rect class="card" x="465" y="115" width="270" height="430" rx="18"/>
  <text class="mono blue" x="600" y="170" text-anchor="middle">range(2, 6)</text>
  <text class="text body muted" x="600" y="205" text-anchor="middle">start = 2</text>
  <text class="text body muted" x="600" y="233" text-anchor="middle">stop = 6</text>
  <path class="line" d="M530 270h145" marker-end="url(#arrow)"/>
  <g>
    <rect class="soft" x="475" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="501" y="329" text-anchor="middle">2</text>
    <rect class="soft" x="535" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="561" y="329" text-anchor="middle">3</text>
    <rect class="soft" x="595" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="621" y="329" text-anchor="middle">4</text>
    <rect class="soft" x="655" y="300" width="52" height="42" rx="9"/><text class="mono olive" x="681" y="329" text-anchor="middle">5</text>
    <rect class="alt" x="565" y="370" width="70" height="42" rx="9"/><text class="mono red" x="600" y="399" text-anchor="middle">6</text>
  </g>
  <text class="text label red" x="600" y="460" text-anchor="middle">stop не включается</text>

  <rect class="accent" x="860" y="115" width="270" height="430" rx="18"/>
  <text class="mono blue" x="995" y="170" text-anchor="middle">range(2, 11, 2)</text>
  <text class="text body muted" x="995" y="205" text-anchor="middle">start = 2</text>
  <text class="text body muted" x="995" y="233" text-anchor="middle">stop = 11</text>
  <text class="text body muted" x="995" y="261" text-anchor="middle">step = 2</text>
  <g>
    <rect class="soft" x="875" y="310" width="52" height="42" rx="9"/><text class="mono olive" x="901" y="339" text-anchor="middle">2</text>
    <rect class="soft" x="935" y="310" width="52" height="42" rx="9"/><text class="mono olive" x="961" y="339" text-anchor="middle">4</text>
    <rect class="soft" x="995" y="310" width="52" height="42" rx="9"/><text class="mono olive" x="1021" y="339" text-anchor="middle">6</text>
    <rect class="soft" x="1055" y="310" width="52" height="42" rx="9"/><text class="mono olive" x="1081" y="339" text-anchor="middle">8</text>
    <rect class="soft" x="900" y="380" width="62" height="42" rx="9"/><text class="mono olive" x="931" y="409" text-anchor="middle">10</text>
    <rect class="alt" x="975" y="380" width="62" height="42" rx="9"/><text class="mono red" x="1006" y="409" text-anchor="middle">11</text>
  </g>
  <text class="text label red" x="995" y="480" text-anchor="middle">11 остаётся за границей</text>
  <text class="text body muted" x="600" y="640" text-anchor="middle">start задаёт первое значение, stop задаёт невключаемую границу, step задаёт шаг</text>
</svg>
