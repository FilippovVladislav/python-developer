<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Направление range</title>
  <desc id="desc">Схема сравнивает движение range вперёд с положительным шагом, назад с отрицательным шагом и пустой результат при range 5 0 без отрицательного шага.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.true{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.false{fill:none;stroke:#c9553d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-true" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
    <marker id="arrow-false" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c9553d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="54" text-anchor="middle">Направление range() определяется знаком шага</text>

  <rect class="accent" x="90" y="110" width="1020" height="150" rx="18"/>
  <text class="mono blue" x="250" y="160" text-anchor="middle">range(1, 6)</text>
  <text class="text label olive" x="250" y="200" text-anchor="middle">step = +1</text>
  <g>
    <rect class="soft" x="440" y="145" width="54" height="42" rx="9"/><text class="mono olive" x="467" y="174" text-anchor="middle">1</text>
    <path class="true" d="M500 166h45" marker-end="url(#arrow-true)"/>
    <rect class="soft" x="560" y="145" width="54" height="42" rx="9"/><text class="mono olive" x="587" y="174" text-anchor="middle">2</text>
    <path class="true" d="M620 166h45" marker-end="url(#arrow-true)"/>
    <rect class="soft" x="680" y="145" width="54" height="42" rx="9"/><text class="mono olive" x="707" y="174" text-anchor="middle">3</text>
    <path class="true" d="M740 166h45" marker-end="url(#arrow-true)"/>
    <rect class="soft" x="800" y="145" width="54" height="42" rx="9"/><text class="mono olive" x="827" y="174" text-anchor="middle">4</text>
    <path class="true" d="M860 166h45" marker-end="url(#arrow-true)"/>
    <rect class="soft" x="920" y="145" width="54" height="42" rx="9"/><text class="mono olive" x="947" y="174" text-anchor="middle">5</text>
    <rect class="alt" x="1000" y="145" width="54" height="42" rx="9"/><text class="mono red" x="1027" y="174" text-anchor="middle">6</text>
  </g>
  <text class="text body red" x="1027" y="218" text-anchor="middle">stop</text>

  <rect class="soft" x="90" y="300" width="1020" height="150" rx="18"/>
  <text class="mono blue" x="250" y="350" text-anchor="middle">range(5, 0, -1)</text>
  <text class="text label olive" x="250" y="390" text-anchor="middle">step = -1</text>
  <g>
    <rect class="accent" x="920" y="335" width="54" height="42" rx="9"/><text class="mono blue" x="947" y="364" text-anchor="middle">5</text>
    <path class="line" d="M915 356h-45" marker-end="url(#arrow)"/>
    <rect class="accent" x="800" y="335" width="54" height="42" rx="9"/><text class="mono blue" x="827" y="364" text-anchor="middle">4</text>
    <path class="line" d="M795 356h-45" marker-end="url(#arrow)"/>
    <rect class="accent" x="680" y="335" width="54" height="42" rx="9"/><text class="mono blue" x="707" y="364" text-anchor="middle">3</text>
    <path class="line" d="M675 356h-45" marker-end="url(#arrow)"/>
    <rect class="accent" x="560" y="335" width="54" height="42" rx="9"/><text class="mono blue" x="587" y="364" text-anchor="middle">2</text>
    <path class="line" d="M555 356h-45" marker-end="url(#arrow)"/>
    <rect class="accent" x="440" y="335" width="54" height="42" rx="9"/><text class="mono blue" x="467" y="364" text-anchor="middle">1</text>
    <rect class="alt" x="360" y="335" width="54" height="42" rx="9"/><text class="mono red" x="387" y="364" text-anchor="middle">0</text>
  </g>
  <text class="text body red" x="387" y="408" text-anchor="middle">stop</text>

  <rect class="alt" x="220" y="500" width="760" height="100" rx="18"/>
  <text class="mono red" x="430" y="542" text-anchor="middle">range(5, 0)</text>
  <text class="text label ink" x="710" y="542" text-anchor="middle">пусто</text>
  <text class="text body muted" x="600" y="575" text-anchor="middle">шаг по умолчанию +1, поэтому от 5 к 0 он не движется</text>
  <text class="text body muted" x="600" y="650" text-anchor="middle">Чтобы идти назад, укажите отрицательный step</text>
</svg>
