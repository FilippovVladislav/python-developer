<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">while и for</title>
  <desc id="desc">Сравнительная схема показывает, что while управляется условием, а for перебирает элементы последовательности.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.true{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-true" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="54" text-anchor="middle">while управляется условием, for — перебором</text>

  <rect class="card" x="70" y="100" width="490" height="500" rx="18"/>
  <text class="mono blue" x="315" y="150" text-anchor="middle">while</text>
  <rect class="accent" x="180" y="185" width="270" height="58" rx="14"/>
  <text class="text label ink" x="315" y="223" text-anchor="middle">начальное состояние</text>
  <path class="line" d="M315 250v30" marker-end="url(#arrow)"/>
  <rect class="soft" x="190" y="295" width="250" height="58" rx="14"/>
  <text class="text label ink" x="315" y="333" text-anchor="middle">условие</text>
  <path class="true" d="M315 360v30" marker-end="url(#arrow-true)"/>
  <text class="text body olive" x="365" y="383" text-anchor="middle">True</text>
  <rect class="card" x="190" y="405" width="250" height="58" rx="14"/>
  <text class="text label ink" x="315" y="443" text-anchor="middle">действие</text>
  <path class="line" d="M315 470v30" marker-end="url(#arrow)"/>
  <rect class="accent" x="160" y="515" width="310" height="58" rx="14"/>
  <text class="text label ink" x="315" y="553" text-anchor="middle">изменение состояния</text>
  <path class="line" d="M155 544C105 460 105 325 180 324" marker-end="url(#arrow)"/>
  <text class="text label ink" x="315" y="648" text-anchor="middle">Повторять, пока условие True</text>

  <rect class="card" x="640" y="100" width="490" height="500" rx="18"/>
  <text class="mono blue" x="885" y="150" text-anchor="middle">for</text>
  <rect class="accent" x="750" y="185" width="270" height="58" rx="14"/>
  <text class="text label ink" x="885" y="223" text-anchor="middle">последовательность</text>
  <path class="line" d="M885 250v30" marker-end="url(#arrow)"/>
  <rect class="soft" x="760" y="295" width="250" height="58" rx="14"/>
  <text class="text label ink" x="885" y="333" text-anchor="middle">следующий элемент</text>
  <path class="line" d="M885 360v30" marker-end="url(#arrow)"/>
  <rect class="card" x="760" y="405" width="250" height="58" rx="14"/>
  <text class="text label ink" x="885" y="443" text-anchor="middle">действие</text>
  <path class="line" d="M1015 434C1068 394 1068 325 1020 324" marker-end="url(#arrow)"/>
  <text class="text body muted" x="1042" y="383" text-anchor="middle">...</text>
  <path class="line" d="M885 470v35" marker-end="url(#arrow)"/>
  <rect class="alt" x="780" y="520" width="210" height="58" rx="14"/>
  <text class="text label ink" x="885" y="558" text-anchor="middle">конец</text>
  <text class="text label ink" x="885" y="648" text-anchor="middle">Выполнить для каждого элемента</text>
</svg>
