<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">for перебирает строку</title>
  <desc id="desc">Схема показывает строку Python как последовательность символов и то, как переменная letter получает P, y, t, h, o, n по очереди.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:36px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="54" text-anchor="middle">for перебирает элементы строки по одному</text>

  <rect class="accent" x="120" y="105" width="960" height="115" rx="18"/>
  <text class="bigmono blue" x="600" y="158" text-anchor="middle">"Python"</text>
  <text class="text body muted" x="600" y="192" text-anchor="middle">строка состоит из символов</text>

  <g>
    <rect class="soft" x="250" y="270" width="72" height="58" rx="12"/><text class="bigmono olive" x="286" y="311" text-anchor="middle">P</text>
    <rect class="soft" x="360" y="270" width="72" height="58" rx="12"/><text class="bigmono olive" x="396" y="311" text-anchor="middle">y</text>
    <rect class="soft" x="470" y="270" width="72" height="58" rx="12"/><text class="bigmono olive" x="506" y="311" text-anchor="middle">t</text>
    <rect class="soft" x="580" y="270" width="72" height="58" rx="12"/><text class="bigmono olive" x="616" y="311" text-anchor="middle">h</text>
    <rect class="soft" x="690" y="270" width="72" height="58" rx="12"/><text class="bigmono olive" x="726" y="311" text-anchor="middle">o</text>
    <rect class="soft" x="800" y="270" width="72" height="58" rx="12"/><text class="bigmono olive" x="836" y="311" text-anchor="middle">n</text>
  </g>
  <path class="line" d="M600 225v35" marker-end="url(#arrow)"/>

  <rect class="card" x="300" y="390" width="600" height="80" rx="18"/>
  <text class="mono blue" x="600" y="440" text-anchor="middle">for letter in "Python"</text>
  <path class="line" d="M600 478v38" marker-end="url(#arrow)"/>

  <rect class="accent" x="115" y="535" width="970" height="78" rx="18"/>
  <text class="mono blue" x="205" y="584" text-anchor="middle">letter = "P"</text>
  <text class="mono blue" x="365" y="584" text-anchor="middle">"y"</text>
  <text class="mono blue" x="505" y="584" text-anchor="middle">"t"</text>
  <text class="mono blue" x="645" y="584" text-anchor="middle">"h"</text>
  <text class="mono blue" x="785" y="584" text-anchor="middle">"o"</text>
  <text class="mono blue" x="925" y="584" text-anchor="middle">"n"</text>

  <text class="text body muted" x="600" y="655" text-anchor="middle">У строки элементами являются отдельные символы</text>
</svg>
