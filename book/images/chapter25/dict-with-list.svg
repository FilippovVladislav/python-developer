<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Словарь со списком</title>
  <desc id="desc">Словарь course хранит список topics. Доступ course[topics][1] возвращает значение Условия.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:21px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Словарь может хранить список как значение</text>

  <rect class="accent" x="120" y="105" width="250" height="78" rx="16"/>
  <text class="mono blue" x="245" y="154" text-anchor="middle">DICT</text>
  <path class="line" d="M370 144h115" marker-end="url(#arrow)"/>
  <rect class="soft" x="505" y="105" width="190" height="78" rx="16"/>
  <text class="mono olive" x="600" y="154" text-anchor="middle">topics</text>
  <path class="line" d="M695 144h115" marker-end="url(#arrow)"/>
  <rect class="accent" x="830" y="105" width="250" height="78" rx="16"/>
  <text class="mono blue" x="955" y="154" text-anchor="middle">LIST</text>

  <rect class="card" x="185" y="245" width="830" height="170" rx="18"/>
  <text class="smallmono blue" x="600" y="292" text-anchor="middle">course = {"title": "Python",</text>
  <text class="smallmono blue" x="600" y="328" text-anchor="middle">          "topics": ["Переменные", "Условия", "Циклы"]}</text>
  <text class="text body muted" x="600" y="378" text-anchor="middle">значение ключа "topics" — обычный список</text>

  <rect class="card" x="245" y="470" width="710" height="85" rx="18"/>
  <rect class="soft" x="285" y="488" width="170" height="48" rx="12"/>
  <text class="smallmono olive" x="370" y="520" text-anchor="middle">0</text>
  <rect class="soft" x="515" y="488" width="170" height="48" rx="12"/>
  <text class="smallmono olive" x="600" y="520" text-anchor="middle">1</text>
  <rect class="soft" x="745" y="488" width="170" height="48" rx="12"/>
  <text class="smallmono olive" x="830" y="520" text-anchor="middle">2</text>
  <text class="text body ink" x="370" y="585" text-anchor="middle">Переменные</text>
  <text class="text body ink" x="600" y="585" text-anchor="middle">Условия</text>
  <text class="text body ink" x="830" y="585" text-anchor="middle">Циклы</text>

  <rect class="soft" x="340" y="620" width="520" height="52" rx="14"/>
  <text class="mono olive" x="600" y="655" text-anchor="middle">course["topics"][1] → "Условия"</text>
</svg>
