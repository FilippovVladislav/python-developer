<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Вложенный доступ слева направо</title>
  <desc id="desc">Выражение products[1][price] разбирается слева направо: список products, индекс 1, словарь монитора, ключ price, значение 32000.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:26px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:21px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Вложенный доступ читается слева направо</text>

  <rect class="accent" x="405" y="90" width="390" height="66" rx="16"/>
  <text class="mono blue" x="600" y="132" text-anchor="middle">products[1]["price"]</text>

  <path class="line" d="M600 165v38" marker-end="url(#arrow)"/>
  <rect class="card" x="460" y="215" width="280" height="58" rx="14"/>
  <text class="mono blue" x="600" y="252" text-anchor="middle">products</text>

  <path class="line" d="M600 280v38" marker-end="url(#arrow)"/>
  <rect class="soft" x="510" y="330" width="180" height="58" rx="14"/>
  <text class="mono olive" x="600" y="367" text-anchor="middle">[1]</text>

  <path class="line" d="M600 395v38" marker-end="url(#arrow)"/>
  <rect class="card" x="300" y="445" width="600" height="86" rx="18"/>
  <text class="smallmono blue" x="600" y="480" text-anchor="middle">{"name": "Монитор", "price": 32000}</text>
  <text class="text body muted" x="600" y="512" text-anchor="middle">получили словарь второго товара</text>

  <path class="line" d="M600 538v32" marker-end="url(#arrow)"/>
  <rect class="soft" x="465" y="582" width="270" height="58" rx="14"/>
  <text class="mono olive" x="600" y="619" text-anchor="middle">["price"] → 32000</text>
</svg>
