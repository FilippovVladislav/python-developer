<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Карта вложенных структур</title>
  <desc id="desc">Три частые модели: список словарей, словарь со списком, словарь со словарем. На каждом уровне сначала определите тип данных.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:20px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">На каждом уровне сначала определите тип данных</text>

  <rect class="card" x="70" y="115" width="320" height="410" rx="18"/>
  <text class="mono blue" x="230" y="165" text-anchor="middle">list → dict</text>
  <text class="text body muted" x="230" y="210" text-anchor="middle">несколько товаров</text>
  <rect class="accent" x="135" y="250" width="190" height="58" rx="14"/>
  <text class="mono blue" x="230" y="287" text-anchor="middle">items</text>
  <path class="line" d="M230 315v42" marker-end="url(#arrow)"/>
  <rect class="soft" x="135" y="370" width="190" height="58" rx="14"/>
  <text class="mono olive" x="230" y="407" text-anchor="middle">[0]</text>
  <path class="line" d="M230 435v32" marker-end="url(#arrow)"/>
  <text class="smallmono blue" x="230" y="495" text-anchor="middle">items[0]["name"]</text>

  <rect class="card" x="440" y="115" width="320" height="410" rx="18"/>
  <text class="mono blue" x="600" y="165" text-anchor="middle">dict → list</text>
  <text class="text body muted" x="600" y="210" text-anchor="middle">курс и темы</text>
  <rect class="accent" x="505" y="250" width="190" height="58" rx="14"/>
  <text class="mono blue" x="600" y="287" text-anchor="middle">course</text>
  <path class="line" d="M600 315v42" marker-end="url(#arrow)"/>
  <rect class="soft" x="505" y="370" width="190" height="58" rx="14"/>
  <text class="mono olive" x="600" y="407" text-anchor="middle">topics</text>
  <path class="line" d="M600 435v32" marker-end="url(#arrow)"/>
  <text class="smallmono blue" x="600" y="495" text-anchor="middle">course["topics"][0]</text>

  <rect class="card" x="810" y="115" width="320" height="410" rx="18"/>
  <text class="mono blue" x="970" y="165" text-anchor="middle">dict → dict</text>
  <text class="text body muted" x="970" y="210" text-anchor="middle">пользователь и contact</text>
  <rect class="accent" x="875" y="250" width="190" height="58" rx="14"/>
  <text class="mono blue" x="970" y="287" text-anchor="middle">user</text>
  <path class="line" d="M970 315v42" marker-end="url(#arrow)"/>
  <rect class="soft" x="875" y="370" width="190" height="58" rx="14"/>
  <text class="mono olive" x="970" y="407" text-anchor="middle">contact</text>
  <path class="line" d="M970 435v32" marker-end="url(#arrow)"/>
  <text class="smallmono blue" x="970" y="495" text-anchor="middle">user["contact"]["email"]</text>

  <rect class="soft" x="220" y="590" width="760" height="58" rx="14"/>
  <text class="text label ink" x="600" y="628" text-anchor="middle">Тип уровня подсказывает, что писать дальше: индекс или ключ</text>
</svg>
