<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Список словарей</title>
  <desc id="desc">Список users содержит два словаря: элемент 0 описывает Анну, элемент 1 описывает Максима. Главная мысль: список может содержать несколько словарей.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:21px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:20px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Список может содержать несколько словарей</text>

  <rect class="accent" x="120" y="100" width="960" height="88" rx="18"/>
  <text class="smallmono blue" x="600" y="137" text-anchor="middle">users = [{"name": "Анна", "age": 25},</text>
  <text class="smallmono blue" x="600" y="166" text-anchor="middle">         {"name": "Максим", "age": 30}]</text>

  <rect class="accent" x="480" y="230" width="240" height="70" rx="16"/>
  <text class="mono blue" x="600" y="274" text-anchor="middle">LIST</text>

  <path class="line" d="M540 305v58" marker-end="url(#arrow)"/>
  <path class="line" d="M660 305v58" marker-end="url(#arrow)"/>

  <rect class="card" x="140" y="375" width="420" height="230" rx="18"/>
  <rect class="soft" x="170" y="405" width="90" height="54" rx="12"/>
  <text class="mono olive" x="215" y="440" text-anchor="middle">[0]</text>
  <text class="mono blue" x="365" y="440" text-anchor="middle">DICT</text>
  <text class="text body ink" x="210" y="505">name → Анна</text>
  <text class="text body ink" x="210" y="550">age → 25</text>

  <rect class="card" x="640" y="375" width="420" height="230" rx="18"/>
  <rect class="soft" x="670" y="405" width="90" height="54" rx="12"/>
  <text class="mono olive" x="715" y="440" text-anchor="middle">[1]</text>
  <text class="mono blue" x="865" y="440" text-anchor="middle">DICT</text>
  <text class="text body ink" x="710" y="505">name → Максим</text>
  <text class="text body ink" x="710" y="550">age → 30</text>

  <rect class="soft" x="260" y="625" width="680" height="52" rx="14"/>
  <text class="text label ink" x="600" y="659" text-anchor="middle">list хранит коллекцию, dict описывает один объект</text>
</svg>
