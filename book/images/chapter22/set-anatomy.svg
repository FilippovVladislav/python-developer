<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Устройство множества</title>
  <desc id="desc">Схема показывает множество values с уникальными значениями 10, 20 и 30, преобразование набора с повторами в уникальный набор и акцент, что индексов у set нет.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:27px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:34px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Set хранит каждое значение один раз</text>
  <text class="text body muted" x="600" y="92" text-anchor="middle">Множество удобно, когда важны сами значения, а не их позиции</text>

  <rect class="accent" x="170" y="125" width="860" height="86" rx="18"/>
  <text class="mono blue" x="600" y="178" text-anchor="middle">values = {10, 20, 30}</text>
  <path class="line" d="M600 214v30" marker-end="url(#arrow)"/>

  <rect class="card" x="170" y="255" width="860" height="160" rx="18"/>
  <text class="text label ink" x="600" y="292" text-anchor="middle">группа уникальных значений</text>
  <circle class="soft" cx="385" cy="350" r="45"/><text class="bigmono olive" x="385" y="362" text-anchor="middle">10</text>
  <circle class="soft" cx="600" cy="350" r="45"/><text class="bigmono olive" x="600" y="362" text-anchor="middle">20</text>
  <circle class="soft" cx="815" cy="350" r="45"/><text class="bigmono olive" x="815" y="362" text-anchor="middle">30</text>

  <rect class="card" x="85" y="470" width="430" height="92" rx="16"/>
  <text class="mono blue" x="300" y="526" text-anchor="middle">{10, 20, 10, 30, 20}</text>
  <path class="line" d="M535 516h90" marker-end="url(#arrow)"/>
  <rect class="soft" x="675" y="470" width="290" height="92" rx="16"/>
  <text class="mono olive" x="820" y="526" text-anchor="middle">{10, 20, 30}</text>

  <rect class="alt" x="390" y="605" width="420" height="54" rx="14"/>
  <text class="text label red" x="600" y="640" text-anchor="middle">индексов нет</text>
</svg>
