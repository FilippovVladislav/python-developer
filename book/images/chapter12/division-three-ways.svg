<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Три способа деления в Python</title>
  <desc id="desc">Схема показывает различие между обычным делением, целочисленным делением и остатком от деления.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:30px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="64" text-anchor="middle">/, // и % отвечают на разные вопросы</text>

  <rect class="card" x="70" y="130" width="300" height="190" rx="18"/>
  <text class="mono blue" x="220" y="185" text-anchor="middle">10 / 3</text>
  <path class="line" d="M220 205v38" marker-end="url(#arrow)"/>
  <text class="mono olive" x="220" y="285" text-anchor="middle">3.333...</text>
  <text class="text body muted" x="220" y="350" text-anchor="middle">результат деления</text>

  <rect class="accent" x="450" y="130" width="300" height="190" rx="18"/>
  <text class="mono blue" x="600" y="185" text-anchor="middle">10 // 3</text>
  <path class="line" d="M600 205v38" marker-end="url(#arrow)"/>
  <text class="mono olive" x="600" y="285" text-anchor="middle">3</text>
  <text class="text body muted" x="600" y="350" text-anchor="middle">количество полных частей</text>

  <rect class="soft" x="830" y="130" width="300" height="190" rx="18"/>
  <text class="mono blue" x="980" y="185" text-anchor="middle">10 % 3</text>
  <path class="line" d="M980 205v38" marker-end="url(#arrow)"/>
  <text class="mono olive" x="980" y="285" text-anchor="middle">1</text>
  <text class="text body muted" x="980" y="350" text-anchor="middle">остаток</text>

  <rect class="card" x="220" y="455" width="760" height="120" rx="20"/>
  <text class="mono ink" x="600" y="525" text-anchor="middle">10 = 3 × 3 + 1</text>
  <path class="line" d="M540 545c-35 35-100 35-135 0"/>
  <text class="text body blue" x="470" y="612" text-anchor="middle">3 полные части</text>
  <path class="line" d="M746 545c25 30 65 30 90 0"/>
  <text class="text body olive" x="790" y="612" text-anchor="middle">1 остаток</text>
</svg>
