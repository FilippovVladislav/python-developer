<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Перевод минут в часы и минуты</title>
  <desc id="desc">Схема показывает, как 135 минут превращаются в 2 часа и 15 минут с помощью операторов // и %.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:30px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="68" text-anchor="middle">// и % удобно использовать вместе</text>

  <rect class="accent" x="430" y="115" width="340" height="90" rx="18"/>
  <text class="mono blue" x="600" y="172" text-anchor="middle">135 минут</text>

  <path class="line" d="M520 215c-115 70-170 130-170 210" marker-end="url(#arrow)"/>
  <path class="line" d="M680 215c115 70 170 130 170 210" marker-end="url(#arrow)"/>

  <rect class="card" x="175" y="285" width="350" height="110" rx="18"/>
  <text class="mono blue" x="350" y="335" text-anchor="middle">135 // 60</text>
  <text class="text body muted" x="350" y="370" text-anchor="middle">полные часы</text>

  <rect class="soft" x="675" y="285" width="350" height="110" rx="18"/>
  <text class="mono blue" x="850" y="335" text-anchor="middle">135 % 60</text>
  <text class="text body muted" x="850" y="370" text-anchor="middle">оставшиеся минуты</text>

  <path class="line" d="M350 405v45" marker-end="url(#arrow)"/>
  <path class="line" d="M850 405v45" marker-end="url(#arrow)"/>

  <rect class="accent" x="225" y="470" width="250" height="90" rx="18"/>
  <text class="text label ink" x="350" y="525" text-anchor="middle">2 часа</text>

  <rect class="soft" x="725" y="470" width="250" height="90" rx="18"/>
  <text class="text label ink" x="850" y="525" text-anchor="middle">15 минут</text>

  <rect class="card" x="330" y="600" width="540" height="62" rx="16"/>
  <text class="text label olive" x="600" y="641" text-anchor="middle">135 минут = 2 часа 15 минут</text>
</svg>
