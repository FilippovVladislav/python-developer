<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Синтаксическая ошибка</title>
  <desc id="desc">В строке кода отсутствует закрывающая кавычка, Python сообщает файл, строку и тип ошибки.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .warn { fill: #fff4f1; stroke: #c9553d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .red { fill: #c9553d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 650; }
      .body { font-size: 21px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 25px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="82" text-anchor="middle">Ошибка показывает, где Python обнаружил проблему</text>

  <rect class="warn" x="95" y="205" width="440" height="160" rx="18"/>
  <text class="text label ink" x="315" y="252" text-anchor="middle">Код с ошибкой</text>
  <text class="mono ink" x="145" y="312">print("Привет, мир!)</text>
  <path d="M392 326h80" stroke="#c9553d" stroke-width="5" stroke-linecap="round"/>
  <text class="text body red" x="315" y="405" text-anchor="middle">нет закрывающей кавычки</text>

  <path class="line" d="M555 285h130" marker-end="url(#arrow)"/>

  <rect class="soft" x="705" y="205" width="220" height="160" rx="20"/>
  <text class="text label ink" x="815" y="272" text-anchor="middle">Python</text>
  <text class="text body muted" x="815" y="314" text-anchor="middle">проверяет синтаксис</text>

  <path class="line" d="M815 385v70" marker-end="url(#arrow)"/>

  <rect class="card" x="280" y="475" width="640" height="135" rx="18"/>
  <text class="text label blue" x="600" y="520" text-anchor="middle">Сообщение об ошибке</text>
  <text class="text body ink" x="365" y="562">Файл: hello.py</text>
  <text class="text body ink" x="555" y="562">Строка: 1</text>
  <text class="text body ink" x="735" y="562">Тип: SyntaxError</text>
  <text class="text body muted" x="600" y="598" text-anchor="middle">это диагностическая информация для исправления кода</text>
</svg>
