<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Запуск Python-программы</title>
  <desc id="desc">Команда python hello.py передает файл интерпретатору Python, после выполнения print результат появляется в терминале.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .accent { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 24px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#2f5f8f"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="82" text-anchor="middle">Команда запуска передает файл интерпретатору</text>

  <rect class="card" x="70" y="250" width="190" height="120" rx="18"/>
  <text class="text label blue" x="165" y="297" text-anchor="middle">Файл</text>
  <text class="mono blue" x="165" y="337" text-anchor="middle">hello.py</text>

  <path class="line" d="M280 310h90" marker-end="url(#arrow)"/>

  <rect class="accent" x="390" y="245" width="240" height="130" rx="18"/>
  <text class="text label ink" x="510" y="292" text-anchor="middle">Команда</text>
  <text class="mono blue" x="510" y="332" text-anchor="middle">python hello.py</text>

  <path class="line" d="M650 310h90" marker-end="url(#arrow)"/>

  <rect class="soft" x="760" y="230" width="250" height="160" rx="20"/>
  <text class="text label ink" x="885" y="287" text-anchor="middle">Интерпретатор</text>
  <text class="text label ink" x="885" y="321" text-anchor="middle">Python</text>
  <text class="text body muted" x="885" y="355" text-anchor="middle">выполняет print(...)</text>

  <path class="line" d="M885 410v72" marker-end="url(#arrow)"/>

  <rect class="card" x="690" y="500" width="390" height="105" rx="18"/>
  <text class="text label blue" x="885" y="540" text-anchor="middle">Терминал</text>
  <text class="mono ink" x="885" y="578" text-anchor="middle">Привет, мир!</text>
</svg>
