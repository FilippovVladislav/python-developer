<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Поток вызова функции</title>
  <desc id="desc">Схема показывает, как вызов greet с аргументом Анна передает значение параметру name, запускает тело функции, выводит Привет Анна и возвращается к основному коду.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:27px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:32px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Вызов передаёт данные и запускает тело</text>

  <rect class="card" x="75" y="120" width="430" height="470" rx="18"/>
  <text class="text label ink" x="290" y="160" text-anchor="middle">Основная программа</text>
  <rect class="accent" x="135" y="205" width="310" height="74" rx="14"/>
  <text class="bigmono blue" x="290" y="252" text-anchor="middle">greet("Анна")</text>
  <rect class="card" x="145" y="472" width="290" height="66" rx="14"/>
  <text class="text label ink" x="290" y="514" text-anchor="middle">следующая команда</text>

  <rect class="card" x="695" y="120" width="430" height="470" rx="18"/>
  <text class="text label ink" x="910" y="160" text-anchor="middle">Функция greet</text>
  <rect class="soft" x="755" y="205" width="310" height="72" rx="14"/>
  <text class="mono olive" x="910" y="250" text-anchor="middle">name = "Анна"</text>
  <rect class="soft" x="755" y="330" width="310" height="72" rx="14"/>
  <text class="mono olive" x="910" y="375" text-anchor="middle">print(...)</text>
  <rect class="accent" x="755" y="458" width="310" height="72" rx="14"/>
  <text class="text label ink" x="910" y="504" text-anchor="middle">Привет, Анна</text>

  <rect class="alt" x="455" y="318" width="290" height="70" rx="14"/>
  <text class="mono blue" x="600" y="362" text-anchor="middle">"Анна"</text>
  <text class="text body ink" x="600" y="412" text-anchor="middle">аргумент становится параметром</text>

  <path class="line" d="M445 242H525V302H600V314" marker-end="url(#arrow)"/>
  <path class="line" d="M745 353H705V242H748" marker-end="url(#arrow)"/>
  <path class="step" d="M910 277v47" marker-end="url(#arrow-olive)"/>
  <path class="step" d="M910 402v50" marker-end="url(#arrow-olive)"/>
  <path class="line" d="M755 494C650 560 515 560 435 505" marker-end="url(#arrow)"/>
  <text class="text body muted" x="600" y="626" text-anchor="middle">после завершения функции выполнение возвращается к основному коду</text>
</svg>
