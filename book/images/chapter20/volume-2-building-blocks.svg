<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Базовые конструкции Python</title>
  <desc id="desc">Итоговая карта второго тома показывает изученные темы: переменные, типы данных, input, преобразование типов, арифметику, сравнения, условия, логические операции, while, for, строки, списки и функции. Эти блоки складываются в программу.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}.big{font-size:31px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Функции собирают изученные конструкции в программу</text>

  <rect class="accent" x="390" y="132" width="420" height="105" rx="18"/>
  <text class="text big ink" x="600" y="176" text-anchor="middle">Базовые конструкции</text>
  <text class="text big ink" x="600" y="213" text-anchor="middle">Python</text>

  <g>
    <rect class="card" x="75" y="125" width="190" height="58" rx="12"/><text class="text label ink" x="170" y="162" text-anchor="middle">Переменные</text>
    <rect class="card" x="75" y="205" width="190" height="58" rx="12"/><text class="text label ink" x="170" y="242" text-anchor="middle">Типы данных</text>
    <rect class="card" x="75" y="285" width="190" height="58" rx="12"/><text class="mono blue" x="170" y="322" text-anchor="middle">input()</text>
    <rect class="card" x="75" y="365" width="190" height="58" rx="12"/><text class="text label ink" x="170" y="402" text-anchor="middle">Преобразование</text>
    <rect class="card" x="75" y="445" width="190" height="58" rx="12"/><text class="text label ink" x="170" y="482" text-anchor="middle">Арифметика</text>
    <rect class="card" x="75" y="525" width="190" height="58" rx="12"/><text class="text label ink" x="170" y="562" text-anchor="middle">Сравнения</text>
  </g>

  <g>
    <rect class="card" x="935" y="125" width="190" height="58" rx="12"/><text class="text label ink" x="1030" y="162" text-anchor="middle">Условия</text>
    <rect class="card" x="935" y="205" width="190" height="58" rx="12"/><text class="text label ink" x="1030" y="242" text-anchor="middle">Логика</text>
    <rect class="card" x="935" y="285" width="190" height="58" rx="12"/><text class="mono blue" x="1030" y="322" text-anchor="middle">while</text>
    <rect class="card" x="935" y="365" width="190" height="58" rx="12"/><text class="mono blue" x="1030" y="402" text-anchor="middle">for</text>
    <rect class="card" x="935" y="445" width="190" height="58" rx="12"/><text class="text label ink" x="1030" y="482" text-anchor="middle">Строки</text>
    <rect class="card" x="935" y="525" width="190" height="58" rx="12"/><text class="text label ink" x="1030" y="562" text-anchor="middle">Списки</text>
  </g>

  <rect class="soft" x="390" y="315" width="420" height="82" rx="18"/>
  <text class="text big ink" x="600" y="366" text-anchor="middle">Функции</text>
  <text class="text body muted" x="600" y="432" text-anchor="middle">дают имя нескольким действиям</text>
  <text class="text body muted" x="600" y="460" text-anchor="middle">и позволяют вызывать их снова</text>

  <path class="line" d="M265 315C335 270 345 207 390 185" marker-end="url(#arrow)"/>
  <path class="line" d="M935 315C865 270 855 207 810 185" marker-end="url(#arrow)"/>
  <path class="step" d="M600 237v70" marker-end="url(#arrow-olive)"/>
  <path class="step" d="M600 400v56" marker-end="url(#arrow-olive)"/>

  <rect class="accent" x="390" y="510" width="420" height="90" rx="18"/>
  <text class="text big ink" x="600" y="565" text-anchor="middle">Программа</text>
  <text class="text body muted" x="600" y="645" text-anchor="middle">Финальный блок тома II: только изученные конструкции</text>
</svg>
