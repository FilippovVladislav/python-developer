<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Поток return</title>
  <desc id="desc">Схема показывает, как result = add 10 5 вызывает функцию, параметры получают 10 и 5, выражение дает 15, return возвращает 15, и result становится равным 15. Рядом сравниваются print и return.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step{fill:none;stroke:#6f7d2d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}.bigmono{font-family:"Cascadia Code",Consolas,monospace;font-size:31px;font-weight:800}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
    <marker id="arrow-olive" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f7d2d"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">return передаёт результат обратно программе</text>

  <rect class="card" x="70" y="100" width="690" height="510" rx="18"/>
  <rect class="accent" x="135" y="130" width="560" height="60" rx="14"/>
  <text class="mono blue" x="415" y="169" text-anchor="middle">result = add(10, 5)</text>
  <path class="line" d="M415 194v38" marker-end="url(#arrow)"/>

  <rect class="card" x="190" y="238" width="450" height="58" rx="14"/>
  <text class="mono blue" x="415" y="275" text-anchor="middle">add(10, 5)</text>
  <path class="line" d="M415 299v36" marker-end="url(#arrow)"/>

  <rect class="soft" x="160" y="342" width="220" height="58" rx="14"/>
  <text class="mono olive" x="270" y="379" text-anchor="middle">a = 10</text>
  <rect class="soft" x="450" y="342" width="220" height="58" rx="14"/>
  <text class="mono olive" x="560" y="379" text-anchor="middle">b = 5</text>
  <path class="step" d="M270 403C290 435 345 448 415 448" marker-end="url(#arrow-olive)"/>
  <path class="step" d="M560 403C540 435 485 448 415 448" marker-end="url(#arrow-olive)"/>

  <rect class="card" x="255" y="424" width="320" height="58" rx="14"/>
  <text class="mono blue" x="415" y="461" text-anchor="middle">a + b = 15</text>
  <path class="line" d="M415 485v34" marker-end="url(#arrow)"/>
  <rect class="soft" x="255" y="526" width="320" height="58" rx="14"/>
  <text class="mono olive" x="415" y="563" text-anchor="middle">return 15</text>
  <path class="line" d="M575 555h48" marker-end="url(#arrow)"/>
  <rect class="accent" x="625" y="526" width="120" height="58" rx="14"/>
  <text class="mono blue" x="685" y="563" text-anchor="middle">15</text>
  <text class="text body ink" x="685" y="603" text-anchor="middle">в result</text>

  <rect class="card" x="820" y="125" width="310" height="390" rx="18"/>
  <text class="text label ink" x="975" y="166" text-anchor="middle">print и return</text>
  <rect class="alt" x="860" y="205" width="230" height="64" rx="14"/>
  <text class="mono red" x="975" y="246" text-anchor="middle">print(15)</text>
  <text class="text body ink" x="975" y="303" text-anchor="middle">показать</text>
  <text class="text body ink" x="975" y="329" text-anchor="middle">пользователю</text>

  <rect class="soft" x="860" y="378" width="230" height="64" rx="14"/>
  <text class="mono olive" x="975" y="419" text-anchor="middle">return 15</text>
  <text class="text body ink" x="975" y="475" text-anchor="middle">передать результат</text>
  <text class="text body ink" x="975" y="501" text-anchor="middle">программе</text>

  <rect class="accent" x="265" y="630" width="670" height="48" rx="14"/>
  <text class="text label ink" x="600" y="662" text-anchor="middle">Возвращённое значение можно сохранять и вычислять дальше</text>
</svg>
