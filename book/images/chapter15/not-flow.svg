<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Как работает not</title>
  <desc id="desc">Оператор not меняет значение is_blocked False на True и is_blocked True на False.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:27px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="56" text-anchor="middle">not меняет логическое значение на противоположное</text>

  <rect class="accent" x="180" y="120" width="300" height="78" rx="16"/>
  <text class="mono blue" x="330" y="168" text-anchor="middle">is_blocked = False</text>
  <path class="line" d="M330 205v50" marker-end="url(#arrow)"/>
  <rect class="card" x="235" y="270" width="190" height="78" rx="16"/>
  <text class="mono blue" x="330" y="319" text-anchor="middle">not</text>
  <path class="line" d="M330 355v50" marker-end="url(#arrow)"/>
  <rect class="soft" x="240" y="420" width="180" height="68" rx="16"/>
  <text class="mono olive" x="330" y="464" text-anchor="middle">True</text>
  <path class="line" d="M330 495v48" marker-end="url(#arrow)"/>
  <rect class="soft" x="170" y="560" width="320" height="78" rx="16"/>
  <text class="text label ink" x="330" y="608" text-anchor="middle">Доступ разрешён</text>

  <rect class="accent" x="720" y="145" width="300" height="78" rx="16"/>
  <text class="mono blue" x="870" y="193" text-anchor="middle">is_blocked = True</text>
  <path class="line" d="M870 230v50" marker-end="url(#arrow)"/>
  <rect class="card" x="775" y="295" width="190" height="78" rx="16"/>
  <text class="mono blue" x="870" y="344" text-anchor="middle">not</text>
  <path class="line" d="M870 380v50" marker-end="url(#arrow)"/>
  <rect class="alt" x="780" y="445" width="180" height="68" rx="16"/>
  <text class="mono red" x="870" y="489" text-anchor="middle">False</text>

  <rect class="card" x="390" y="255" width="420" height="76" rx="18"/>
  <text class="text label ink" x="600" y="302" text-anchor="middle">not отвечает на вопрос «не заблокирован?»</text>
</svg>
