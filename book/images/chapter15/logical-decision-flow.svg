<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Составное условие как одно решение</title>
  <desc id="desc">Схема показывает путь от пользователя и input через преобразование, сравнения, логические операторы, True или False, if и действие Вход разрешён.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:24px;font-weight:700}.smallmono{font-family:"Cascadia Code",Consolas,monospace;font-size:20px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="52" text-anchor="middle">Несколько простых условий объединяются в одно решение</text>

  <rect class="card" x="70" y="105" width="160" height="70" rx="14"/>
  <text class="text label ink" x="150" y="148" text-anchor="middle">Пользователь</text>
  <path class="line" d="M235 140h50" marker-end="url(#arrow)"/>
  <rect class="accent" x="300" y="105" width="135" height="70" rx="14"/>
  <text class="mono blue" x="368" y="148" text-anchor="middle">input()</text>
  <path class="line" d="M440 140h50" marker-end="url(#arrow)"/>
  <rect class="soft" x="505" y="105" width="185" height="70" rx="14"/>
  <text class="text label ink" x="598" y="134" text-anchor="middle">преобразование</text>
  <text class="smallmono blue" x="598" y="160" text-anchor="middle">int(), == "yes"</text>

  <path class="line" d="M598 182v45" marker-end="url(#arrow)"/>
  <rect class="accent" x="165" y="245" width="245" height="70" rx="14"/>
  <text class="mono blue" x="288" y="288" text-anchor="middle">age &gt;= 18</text>
  <rect class="accent" x="475" y="245" width="245" height="70" rx="14"/>
  <text class="mono blue" x="598" y="288" text-anchor="middle">has_ticket</text>
  <rect class="accent" x="785" y="245" width="245" height="70" rx="14"/>
  <text class="mono blue" x="908" y="288" text-anchor="middle">not is_blocked</text>

  <path class="line" d="M288 322C340 370 470 375 535 405" marker-end="url(#arrow)"/>
  <path class="line" d="M598 322v70" marker-end="url(#arrow)"/>
  <path class="line" d="M908 322C856 370 726 375 661 405" marker-end="url(#arrow)"/>
  <rect class="card" x="505" y="415" width="190" height="74" rx="16"/>
  <text class="mono blue" x="600" y="462" text-anchor="middle">and</text>
  <path class="line" d="M600 496v43" marker-end="url(#arrow)"/>
  <rect class="soft" x="510" y="550" width="180" height="62" rx="16"/>
  <text class="mono olive" x="600" y="590" text-anchor="middle">True</text>
  <path class="line" d="M695 581h66" marker-end="url(#arrow)"/>
  <rect class="soft" x="780" y="540" width="100" height="82" rx="16"/>
  <text class="mono blue" x="830" y="590" text-anchor="middle">if</text>
  <path class="line" d="M885 581h66" marker-end="url(#arrow)"/>
  <rect class="soft" x="970" y="540" width="170" height="82" rx="16"/>
  <text class="text label ink" x="1055" y="590" text-anchor="middle">Вход разрешён</text>

  <rect class="card" x="730" y="105" width="380" height="86" rx="18"/>
  <text class="smallmono olive" x="920" y="139" text-anchor="middle">age &gt;= 18 and has_ticket</text>
  <text class="smallmono olive" x="920" y="168" text-anchor="middle">and not is_blocked</text>
  <text class="text body muted" x="600" y="660" text-anchor="middle">Логические операторы собирают несколько сравнений в одно условие для if</text>
</svg>
