<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Как работает or</title>
  <desc id="desc">Условия total больше или равно 3000 и has_subscription сходятся в оператор or; одного истинного условия достаточно для бесплатной доставки.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:26px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="56" text-anchor="middle">Для or достаточно одного подходящего варианта</text>

  <rect class="accent" x="160" y="120" width="285" height="78" rx="16"/>
  <text class="mono blue" x="302" y="168" text-anchor="middle">total &gt;= 3000</text>
  <path class="line" d="M302 205v46" marker-end="url(#arrow)"/>
  <rect class="alt" x="212" y="265" width="180" height="70" rx="16"/>
  <text class="mono red" x="302" y="309" text-anchor="middle">False</text>

  <rect class="accent" x="535" y="120" width="305" height="78" rx="16"/>
  <text class="mono blue" x="688" y="168" text-anchor="middle">has_subscription</text>
  <path class="line" d="M688 205v46" marker-end="url(#arrow)"/>
  <rect class="soft" x="598" y="265" width="180" height="70" rx="16"/>
  <text class="mono olive" x="688" y="309" text-anchor="middle">True</text>

  <path class="line" d="M302 342C365 392 468 392 510 428" marker-end="url(#arrow)"/>
  <path class="line" d="M688 342C625 392 552 392 510 428" marker-end="url(#arrow)"/>
  <rect class="card" x="415" y="440" width="190" height="78" rx="16"/>
  <text class="mono blue" x="510" y="489" text-anchor="middle">or</text>
  <path class="line" d="M510 525v43" marker-end="url(#arrow)"/>
  <rect class="soft" x="420" y="580" width="180" height="62" rx="16"/>
  <text class="mono olive" x="510" y="620" text-anchor="middle">True</text>
  <path class="line" d="M605 611h78" marker-end="url(#arrow)"/>
  <rect class="soft" x="700" y="570" width="330" height="82" rx="16"/>
  <text class="text label ink" x="865" y="620" text-anchor="middle">Бесплатная доставка</text>

  <rect class="card" x="855" y="240" width="245" height="115" rx="18"/>
  <text class="mono olive" x="978" y="292" text-anchor="middle">False or True</text>
  <text class="mono blue" x="978" y="330" text-anchor="middle">→ True</text>
</svg>
