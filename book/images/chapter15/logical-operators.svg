<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Карта логических операторов Python</title>
  <desc id="desc">Три карточки показывают операторы and, or и not с примерами результатов True и False.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:36px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:20px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:25px;font-weight:700}.op{font-family:"Cascadia Code",Consolas,monospace;font-size:46px;font-weight:800}
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="58" text-anchor="middle">Логические операторы</text>
  <text class="text body muted" x="600" y="94" text-anchor="middle">and, or и not объединяют или изменяют логические значения</text>

  <rect class="accent" x="70" y="150" width="320" height="360" rx="18"/>
  <text class="op blue" x="230" y="220" text-anchor="middle">and</text>
  <text class="text label ink" x="230" y="264" text-anchor="middle">И</text>
  <rect class="card" x="105" y="310" width="250" height="62" rx="14"/>
  <text class="mono olive" x="230" y="350" text-anchor="middle">True and True</text>
  <text class="mono blue" x="230" y="416" text-anchor="middle">→ True</text>
  <rect class="card" x="105" y="445" width="250" height="62" rx="14"/>
  <text class="mono olive" x="230" y="485" text-anchor="middle">True and False</text>
  <text class="mono blue" x="230" y="548" text-anchor="middle">→ False</text>

  <rect class="card" x="440" y="150" width="320" height="360" rx="18"/>
  <text class="op blue" x="600" y="220" text-anchor="middle">or</text>
  <text class="text label ink" x="600" y="264" text-anchor="middle">ИЛИ</text>
  <rect class="soft" x="475" y="310" width="250" height="62" rx="14"/>
  <text class="mono olive" x="600" y="350" text-anchor="middle">False or True</text>
  <text class="mono blue" x="600" y="416" text-anchor="middle">→ True</text>
  <rect class="card" x="475" y="445" width="250" height="62" rx="14"/>
  <text class="mono olive" x="600" y="485" text-anchor="middle">False or False</text>
  <text class="mono blue" x="600" y="548" text-anchor="middle">→ False</text>

  <rect class="soft" x="810" y="150" width="320" height="360" rx="18"/>
  <text class="op blue" x="970" y="220" text-anchor="middle">not</text>
  <text class="text label ink" x="970" y="264" text-anchor="middle">НЕ</text>
  <rect class="card" x="845" y="310" width="250" height="62" rx="14"/>
  <text class="mono olive" x="970" y="350" text-anchor="middle">not True</text>
  <text class="mono blue" x="970" y="416" text-anchor="middle">→ False</text>
  <rect class="card" x="845" y="445" width="250" height="62" rx="14"/>
  <text class="mono olive" x="970" y="485" text-anchor="middle">not False</text>
  <text class="mono blue" x="970" y="548" text-anchor="middle">→ True</text>

  <rect class="card" x="250" y="585" width="700" height="66" rx="18"/>
  <text class="text label ink" x="600" y="626" text-anchor="middle">Несколько условий превращаются в один ответ True или False</text>
</svg>
