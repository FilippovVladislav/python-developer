<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Как работает and</title>
  <desc id="desc">Два истинных условия age больше или равно 18 и has_ticket сходятся в оператор and, который даёт True и разрешает вход; рядом показан вариант True and False.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.accent{fill:#eef4f8;stroke:#2f5f8f;stroke-width:4}.soft{fill:#f0f3df;stroke:#6f7d2d;stroke-width:4}.alt{fill:#fff4f1;stroke:#c9553d;stroke-width:4}.ink{fill:#17212b}.muted{fill:#5f6b78}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.line{fill:none;stroke:#2f5f8f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.text{font-family:"Segoe UI",Arial,sans-serif}.title{font-size:34px;font-weight:700}.label{font-size:22px;font-weight:650}.body{font-size:19px}.mono{font-family:"Cascadia Code",Consolas,monospace;font-size:27px;font-weight:700}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f5f8f"/></marker>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="56" text-anchor="middle">Для and должны выполняться все требования</text>

  <rect class="accent" x="150" y="120" width="260" height="78" rx="16"/>
  <text class="mono blue" x="280" y="168" text-anchor="middle">age &gt;= 18</text>
  <path class="line" d="M280 205v46" marker-end="url(#arrow)"/>
  <rect class="soft" x="190" y="265" width="180" height="70" rx="16"/>
  <text class="mono olive" x="280" y="309" text-anchor="middle">True</text>

  <rect class="accent" x="500" y="120" width="260" height="78" rx="16"/>
  <text class="mono blue" x="630" y="168" text-anchor="middle">has_ticket</text>
  <path class="line" d="M630 205v46" marker-end="url(#arrow)"/>
  <rect class="soft" x="540" y="265" width="180" height="70" rx="16"/>
  <text class="mono olive" x="630" y="309" text-anchor="middle">True</text>

  <path class="line" d="M280 342C330 390 420 395 455 428" marker-end="url(#arrow)"/>
  <path class="line" d="M630 342C580 390 490 395 455 428" marker-end="url(#arrow)"/>
  <rect class="card" x="360" y="440" width="190" height="78" rx="16"/>
  <text class="mono blue" x="455" y="489" text-anchor="middle">and</text>
  <path class="line" d="M455 525v43" marker-end="url(#arrow)"/>
  <rect class="soft" x="365" y="580" width="180" height="62" rx="16"/>
  <text class="mono olive" x="455" y="620" text-anchor="middle">True</text>
  <path class="line" d="M550 611h78" marker-end="url(#arrow)"/>
  <rect class="soft" x="645" y="570" width="300" height="82" rx="16"/>
  <text class="text label ink" x="795" y="620" text-anchor="middle">Вход разрешён</text>

  <rect class="alt" x="835" y="145" width="260" height="210" rx="18"/>
  <text class="text label ink" x="965" y="190" text-anchor="middle">Если билет отсутствует</text>
  <text class="mono red" x="965" y="250" text-anchor="middle">True and False</text>
  <text class="mono red" x="965" y="305" text-anchor="middle">→ False</text>
  <text class="text body muted" x="965" y="395" text-anchor="middle">Одного False достаточно,</text>
  <text class="text body muted" x="965" y="423" text-anchor="middle">чтобы итог стал False</text>
</svg>
