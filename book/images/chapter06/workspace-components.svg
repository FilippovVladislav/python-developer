<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Рабочее место Python-разработчика</title>
  <desc id="desc">Для старта нужны Python, редактор кода, терминал и браузер.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .card { fill: #ffffff; stroke: #d8dee8; stroke-width: 3; }
      .center { fill: #eef4f8; stroke: #2f5f8f; stroke-width: 4; }
      .soft { fill: #f0f3df; stroke: #6f7d2d; stroke-width: 4; }
      .ink { fill: #17212b; }
      .muted { fill: #5f6b78; }
      .blue { fill: #2f5f8f; }
      .olive { fill: #6f7d2d; }
      .line { fill: none; stroke: #2f5f8f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { font-size: 36px; font-weight: 700; }
      .label { font-size: 23px; font-weight: 650; }
      .body { font-size: 20px; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 25px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title ink" x="600" y="82" text-anchor="middle">Для старта нужно всего несколько инструментов</text>

  <rect class="center" x="415" y="270" width="370" height="130" rx="22"/>
  <text class="text label ink" x="600" y="320" text-anchor="middle">Рабочее место</text>
  <text class="text label ink" x="600" y="354" text-anchor="middle">Python-разработчика</text>

  <rect class="card" x="110" y="160" width="280" height="96" rx="16"/>
  <text class="text label blue" x="250" y="216" text-anchor="middle">Python</text>
  <text class="mono olive" x="250" y="244" text-anchor="middle">3.x</text>

  <rect class="card" x="810" y="160" width="280" height="96" rx="16"/>
  <text class="text label blue" x="950" y="203" text-anchor="middle">Visual Studio Code</text>
  <text class="text body muted" x="950" y="235" text-anchor="middle">редактор кода</text>

  <rect class="soft" x="110" y="470" width="280" height="96" rx="16"/>
  <text class="text label ink" x="250" y="526" text-anchor="middle">Терминал</text>
  <text class="mono olive" x="250" y="554" text-anchor="middle">&gt; python</text>

  <rect class="soft" x="810" y="470" width="280" height="96" rx="16"/>
  <text class="text label ink" x="950" y="526" text-anchor="middle">Браузер</text>
  <text class="text body muted" x="950" y="554" text-anchor="middle">документация и поиск</text>

  <path class="line" d="M390 225l85 60"/>
  <path class="line" d="M810 225l-85 60"/>
  <path class="line" d="M390 520l85-120"/>
  <path class="line" d="M810 520l-85-120"/>
</svg>
