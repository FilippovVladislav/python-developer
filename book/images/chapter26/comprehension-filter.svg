<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Фильтрация в list comprehension</title><desc id="desc">Условие пропускает в новый список только числа 12 и 20.</desc><defs><style>.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.red{fill:#c9553d}.ink{fill:#17212b}.text{font-family:Segoe UI,Arial,sans-serif}.h{font-size:30px;font-weight:700}.b{font-size:21px}.m{font-family:Consolas,monospace;font-size:23px;font-weight:700}.line{stroke:#2f5f8f;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#2f5f8f" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1200" height="620"/><text class="text h ink" x="600" y="55" text-anchor="middle">[number for number in numbers if number &gt;= 10]</text><text class="text b blue" x="600" y="120" text-anchor="middle">if решает, попадёт ли элемент в новый список</text><path class="line" d="M600 145v45"/><rect class="card" x="150" y="210" width="900" height="95" rx="16"/><text class="m ink" x="250" y="270" text-anchor="middle">3 → ✕</text><text class="m ink" x="390" y="270" text-anchor="middle">8 → ✕</text><text class="m olive" x="540" y="270" text-anchor="middle">12 → ✓</text><text class="m ink" x="690" y="270" text-anchor="middle">5 → ✕</text><text class="m olive" x="840" y="270" text-anchor="middle">20 → ✓</text><text class="m ink" x="970" y="270" text-anchor="middle">7 → ✕</text><path class="line" d="M600 320v55"/><rect x="425" y="405" width="350" height="75" rx="15" fill="#f0f3df" stroke="#6f7d2d" stroke-width="3"/><text class="m olive" x="600" y="452" text-anchor="middle">[12, 20]</text></svg>
