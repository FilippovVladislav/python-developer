<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">List comprehension для списка словарей</title><desc id="desc">Фильтрация списка словарей по цене и извлечение названий создают список строк.</desc><defs><style>.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.ink{fill:#17212b}.text{font-family:Segoe UI,Arial,sans-serif}.h{font-size:30px;font-weight:700}.b{font-size:21px}.m{font-family:Consolas,monospace;font-size:19px;font-weight:700}.line{stroke:#2f5f8f;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#2f5f8f" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1200" height="690"/><text class="text h ink" x="600" y="55" text-anchor="middle">Из list[dict] в list[str]</text><rect class="card" x="100" y="110" width="1000" height="150" rx="16"/><text class="m blue" x="600" y="155" text-anchor="middle">[{"name": "Ноутбук", "price": 85000}, {"name": "Монитор", "price": 32000},</text><text class="m blue" x="600" y="195" text-anchor="middle"> {"name": "Мышь", "price": 2500}]</text><text class="text b ink" x="600" y="237" text-anchor="middle">list[dict]</text><path class="line" d="M600 275v55"/><rect class="card" x="350" y="350" width="500" height="70" rx="14"/><text class="m olive" x="600" y="394" text-anchor="middle">product["price"] &gt; 10000</text><path class="line" d="M600 435v55"/><rect class="card" x="350" y="510" width="500" height="70" rx="14"/><text class="m blue" x="600" y="554" text-anchor="middle">product["name"]</text><path class="line" d="M600 595v25"/><text class="m olive" x="600" y="665" text-anchor="middle">["Ноутбук", "Монитор"]</text></svg>
