<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Строение list comprehension</title><desc id="desc">Выражение, текущий элемент и источник данных образуют list comprehension.</desc><defs><style>.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.ink{fill:#17212b}.muted{fill:#5f6b78}.text{font-family:Segoe UI,Arial,sans-serif}.h{font-size:32px;font-weight:700}.b{font-size:21px}.m{font-family:Consolas,monospace;font-size:24px;font-weight:700}.line{stroke:#2f5f8f;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#2f5f8f" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1200" height="650"/><text class="text h ink" x="600" y="58" text-anchor="middle">expression + for + источник данных</text><rect class="card" x="105" y="110" width="990" height="90" rx="18"/><text class="m blue" x="600" y="165" text-anchor="middle">[ number ** 2  for number  in numbers ]</text><path class="line" d="M280 210v55"/><path class="line" d="M595 210v55"/><path class="line" d="M890 210v55"/><rect class="card" x="95" y="280" width="350" height="110" rx="16"/><text class="text b blue" x="270" y="325" text-anchor="middle">ЧТО ДОБАВИТЬ</text><text class="m ink" x="270" y="365" text-anchor="middle">number ** 2</text><rect class="card" x="425" y="280" width="350" height="110" rx="16"/><text class="text b blue" x="600" y="325" text-anchor="middle">ТЕКУЩИЙ ЭЛЕМЕНТ</text><text class="m ink" x="600" y="365" text-anchor="middle">for number</text><rect class="card" x="755" y="280" width="350" height="110" rx="16"/><text class="text b olive" x="930" y="325" text-anchor="middle">ОТКУДА БРАТЬ</text><text class="m ink" x="930" y="365" text-anchor="middle">in numbers</text><path class="line" d="M600 425v55"/><text class="m blue" x="600" y="535" text-anchor="middle">numbers → number → number ** 2 → новый list</text></svg>
