<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc"><title id="title">Фильтрация и преобразование</title><desc id="desc">Сначала условие оставляет чётные числа, затем выражение возводит их в квадрат.</desc><defs><style>.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.ink{fill:#17212b}.text{font-family:Segoe UI,Arial,sans-serif}.h{font-size:30px;font-weight:700}.b{font-size:21px}.m{font-family:Consolas,monospace;font-size:23px;font-weight:700}.line{stroke:#2f5f8f;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#2f5f8f" d="M0 0 10 5 0 10z"/></marker></defs><rect class="bg" width="1200" height="680"/><text class="text h ink" x="600" y="55" text-anchor="middle">Фильтрация + преобразование</text><text class="m blue" x="600" y="105" text-anchor="middle">number ** 2 for number in numbers if number % 2 == 0</text><rect class="card" x="120" y="155" width="960" height="65" rx="14"/><text class="m ink" x="600" y="197" text-anchor="middle">1   2   3   4   5   6</text><path class="line" d="M600 235v50"/><rect class="card" x="350" y="300" width="500" height="70" rx="14"/><text class="text b blue" x="475" y="343" text-anchor="middle">ФИЛЬТР</text><text class="m olive" x="680" y="343" text-anchor="middle">2   4   6</text><path class="line" d="M600 385v50"/><rect class="card" x="350" y="450" width="500" height="70" rx="14"/><text class="text b blue" x="450" y="493" text-anchor="middle">ПРЕОБРАЗОВАНИЕ</text><text class="m olive" x="690" y="493" text-anchor="middle">4   16   36</text><path class="line" d="M600 535v35"/><text class="m blue" x="600" y="625" text-anchor="middle">НОВЫЙ LIST: [4, 16, 36]</text></svg>
