<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Обычный цикл и list comprehension</title><desc id="desc">Два способа создать список квадратов дают одинаковый результат.</desc>
  <defs><style>.bg{fill:#fbfaf7}.card{fill:#fff;stroke:#d8dee8;stroke-width:3}.blue{fill:#2f5f8f}.olive{fill:#6f7d2d}.ink{fill:#17212b}.muted{fill:#5f6b78}.line{stroke:#2f5f8f;stroke-width:4;fill:none;marker-end:url(#a)}.text{font-family:Segoe UI,Arial,sans-serif}.h{font-size:29px;font-weight:700}.b{font-size:20px}.m{font-family:Consolas,monospace;font-size:20px;font-weight:700}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path fill="#2f5f8f" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="bg" width="1200" height="700"/><text class="text h ink" x="600" y="58" text-anchor="middle">Один результат — более компактная запись</text>
  <rect class="card" x="70" y="105" width="500" height="430" rx="18"/><text class="text h blue" x="320" y="152" text-anchor="middle">ОБЫЧНЫЙ FOR</text><text class="m ink" x="120" y="205">squares = []</text><text class="m ink" x="120" y="245">for number in numbers:</text><text class="m ink" x="145" y="285">squares.append(number ** 2)</text><path class="line" d="M320 315v92"/><text class="text b muted" x="320" y="360" text-anchor="middle">пустой list → for → преобразование → append</text><rect x="150" y="425" width="340" height="65" rx="13" fill="#eef4f8" stroke="#2f5f8f" stroke-width="3"/><text class="m blue" x="320" y="466" text-anchor="middle">[1, 4, 9, 16, 25]</text>
  <rect class="card" x="630" y="105" width="500" height="430" rx="18"/><text class="text h olive" x="880" y="152" text-anchor="middle">LIST COMPREHENSION</text><text class="m ink" x="680" y="215">squares = [</text><text class="m ink" x="705" y="255">number ** 2</text><text class="m ink" x="705" y="295">for number in numbers</text><text class="m ink" x="680" y="335">]</text><path class="line" d="M880 360v47"/><rect x="710" y="425" width="340" height="65" rx="13" fill="#f0f3df" stroke="#6f7d2d" stroke-width="3"/><text class="m olive" x="880" y="466" text-anchor="middle">[1, 4, 9, 16, 25]</text>
  <text class="text b muted" x="600" y="630" text-anchor="middle">List comprehension удобен, когда такая запись остаётся легко читаемой.</text>
</svg>
