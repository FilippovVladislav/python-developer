name: Build and publish Quarto book

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-mono

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: quarto-book-pdf
          path: build/*.pdf
          if-no-files-found: error

      - name: Publish HTML to gh-pages
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git worktree add gh-pages-worktree FETCH_HEAD
          else
            git worktree add --orphan gh-pages gh-pages-worktree
          fi

          find gh-pages-worktree -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R build/. gh-pages-worktree/
          touch gh-pages-worktree/.nojekyll

          cd gh-pages-worktree
          git add --all
          git commit -m "Publish Quarto book" || exit 0
          git push origin HEAD:gh-pages
