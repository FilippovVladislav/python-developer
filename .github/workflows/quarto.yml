name: Render Quarto book

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install PDF fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-mono

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: all

      - name: Upload rendered book
        uses: actions/upload-artifact@v4
        with:
          name: quarto-book
          path: build
