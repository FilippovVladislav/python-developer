project:
  type: book
  output-dir: build
  resources:
    - book/examples/**
    - book/assets/**

book:
  title: "Путь Python-разработчика"
  subtitle: "От полного новичка до первой работы"
  author: "Владислав"
  date: today
  date-format: "D MMMM YYYY"
  language: ru
  search: true
  page-navigation: true
  reader-mode: true
  downloads:
    - pdf

  chapters:
    - index.qmd
    - part: book/tom-01-basics.qmd
      chapters:
        - book/chapters/01-thinking-like-computer.qmd
        - book/chapters/02-why-binary.qmd
        - book/chapters/03-how-computers-store-data.qmd
        - book/chapters/04-how-programs-run.qmd
        - book/chapters/05-why-python.qmd
        - book/chapters/06-python-workspace.qmd
        - book/chapters/07-first-python-program.qmd

format:
  html:
    theme:
      - cosmo
      - theme/book.scss
    css:
      - book/assets/css/python-playground.css
    include-after-body:
      - book/assets/html/python-playground-loader.html
    lang: ru
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    number-sections: true
    fig-cap-location: bottom
    link-external-newwindow: true

  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    lang: ru
    toc: true
    toc-depth: 3
    number-sections: true
    papersize: a4
    geometry:
      - top=25mm
      - bottom=25mm
      - left=28mm
      - right=23mm
    include-in-header:
      - theme/pdf-header.tex
    colorlinks: true
    fig-cap-location: bottom
    code-overflow: wrap
